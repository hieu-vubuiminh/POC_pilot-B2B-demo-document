<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ sơ giải pháp — Kế nghiệp số Gia Lai</title>
<style>
:root{
  --bg:#F4F6F5; --card:#FFF; --sunk:#EAEDEC;
  --ink:#14191B; --ink2:#48524F; --ink3:#76817E;
  --line:#DBDFDD; --line2:#BCC3C0;
  --brand:#0E6360; --brand-soft:#E3EEED; --brand-ink:#0A4A48;
  --ok:#2C6238; --ok-soft:#E5EFE7;
  --warn:#8A5B10; --warn-soft:#FAF0DC;
  --crit:#A32E24; --crit-soft:#F9E7E4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15.5px;line-height:1.58;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 90px}

header{background:var(--brand);color:#fff;padding:22px 0 20px}
header .wrap{padding-bottom:0}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.82}
header h1{margin:7px 0 5px;font-size:clamp(21px,2.7vw,31px);font-weight:670;letter-spacing:-.018em}
header .sub{font-size:13.5px;opacity:.9;max-width:70ch}

nav.tabs{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs .wrap{display:flex;gap:2px;padding:0 20px}
nav.tabs button{
  border:none;background:none;padding:13px 12px;font:inherit;font-size:13.5px;font-weight:620;
  color:var(--ink3);border-bottom:2.5px solid transparent;white-space:nowrap;cursor:pointer;
}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
nav.tabs button .cl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;opacity:.7;display:block}

section{padding-top:26px}
h2{margin:0 0 4px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:660;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
h2+.lede{margin:0 0 16px;font-size:clamp(19px,2.2vw,25px);font-weight:645;letter-spacing:-.014em;max-width:36ch;text-wrap:balance}
h3{margin:24px 0 9px;font-size:16.5px;font-weight:655}
p{margin:0 0 12px;max-width:78ch}
ul{margin:0 0 12px;padding-left:19px;max-width:78ch} li{margin-bottom:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.card>.hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.hd h4{margin:0;font-size:14.5px;font-weight:660;flex:1;min-width:180px}
.card>.hd .sub{font-size:12px;color:var(--ink3)}
.card>.bd{padding:14px 16px}

.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:660;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
tbody tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
tfoot td{background:var(--sunk);font-weight:665;border-bottom:none}
tr.free td{background:var(--ok-soft)}

.tag{display:inline-block;font-size:10.5px;font-weight:660;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.no{background:var(--sunk);color:var(--ink3)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.tag.br{background:var(--brand-soft);color:var(--brand)}
.clause{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--brand);white-space:nowrap}

.note{border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.52;margin:0 0 12px}
.note.br{background:var(--brand-soft);color:var(--brand-ink);border:1px solid #B9D8D6}
.note.warn{background:var(--warn-soft);color:#5E3E08;border:1px solid #EBD5A8}
.note.crit{background:var(--crit-soft);color:#78221A;border:1px solid #EBBFB8}
.note.ok{background:var(--ok-soft);color:#1F4A28;border:1px solid #BCD8C3}

/* chọn chân dung */
.pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pick button{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:9px 13px;font:inherit;font-size:13.5px;font-weight:620;cursor:pointer;text-align:left}
.pick button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pick button small{display:block;font-weight:400;font-size:11.5px;opacity:.8}

/* 4 mốc */
.mocs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:980px){.mocs{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.mocs{grid-template-columns:1fr}}
.moc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.moc .top{padding:11px 13px;background:var(--brand);color:#fff}
.moc .top b{display:block;font-size:14px}
.moc .top span{font-size:11.5px;opacity:.85}
.moc .mins{padding:11px 13px;border-bottom:1px solid var(--line);background:var(--sunk)}
.moc .mins b{font-size:23px;font-weight:700;letter-spacing:-.02em}
.moc .mins span{font-size:11.5px;color:var(--ink3);display:block}
.moc .seg{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px}
.moc .seg:last-child{border-bottom:none}
.moc .seg .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:650;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:4px}
.moc .seg.risk{background:var(--crit-soft)}
.moc .seg.fix{background:var(--ok-soft)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.kpis>div{background:var(--card);padding:13px 15px}
.kpis .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.kpis .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpis .n{font-size:11.5px;color:var(--ink3);margin-top:2px}

.step{display:grid;grid-template-columns:64px 1fr;gap:0 14px;padding:13px 16px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:680;color:var(--brand)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:655}
.step .why{font-size:12.5px;color:var(--ink3);margin-bottom:5px}
.step .do{font-size:13.5px}
.step.hand{background:var(--brand-soft)}

a{color:var(--brand)}
button.b{font:inherit;color:inherit;cursor:pointer;min-height:38px;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:0 13px;font-size:13.5px;font-weight:620}
button.b.pri{background:var(--brand);border-color:var(--brand);color:#fff}
footer{border-top:1px solid var(--line);margin-top:34px;padding-top:16px;font-size:12.5px;color:var(--ink3)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Đối thoại thị trường · Chương trình Kế nghiệp số Gia Lai</div>
    <h1>Hồ sơ giải pháp</h1>
    <div class="sub">Bản mô phỏng để hội đồng đối chiếu trực tiếp với Bài toán đặt hàng. Mọi mục dưới đây neo về số điều khoản của chính bài toán, và mọi con số đều tính từ dữ liệu ba chân dung chứ không nhập tay.</div>
  </div>
</header>

<nav class="tabs"><div class="wrap" id="tabs"></div></nav>
<div class="wrap" id="app"></div>

<script src="js/sm-core.js?v=20260818j"></script>
<script src="js/sm-seed-gialai.js?v=20260818j"></script>
<script src="js/sm-domain.js?v=20260818j"></script>
<script src="js/sm-ai.js?v=20260818j"></script>
<script src="js/sm-inbox.js?v=20260818j"></script>
<script src="js/sm-ops.js?v=20260818j"></script>
<script src="js/sm-program.js?v=20260818j"></script>
<script>
(function(){
'use strict';
const D=SM.dom,P=SM.prog,AI=SM.ai,F=SM.fmt,E=F.esc;
const $=s=>document.querySelector(s);

const TABS=[
  {id:'moc',   ten:'Ba chân dung, bốn mốc', cl:'Mục III'},
  {id:'gia',   ten:'Giá và mô hình giá',    cl:'IV.9 · V.2'},
  {id:'ketnoi',ten:'Hệ sinh thái kết nối',  cl:'IV.3'},
  {id:'nguoi', ten:'Đội tại chỗ',           cl:'IV.6 · V.3'},
  {id:'nghe',  ten:'Nhân rộng',             cl:'V.1'},
  {id:'demo',  ten:'Kịch bản demo',         cl:'VI.1(e)'},
  {id:'matran',ten:'Ma trận đối chiếu',     cl:'toàn bộ Mục IV'},
  {id:'bando', ten:'Bản đồ màn hình',       cl:'toàn sản phẩm'},
  {id:'duongdi',ten:'Đường đi dữ liệu',     cl:'IV.3 · IV.4'},
];
let TAB='moc', HO='cd1';

/* ══════════════════════════ BỐN MỐC × BA CHÂN DUNG (Mục III) ═══════════ */
function secMoc(){
  const t=SM.tenant(HO), hj=P.HANH_TRINH[HO], gia=P.tinhGia(t.nganh);
  const est=D.taxEstimate(t), pos=D.needsPosInvoice(t);

  let h=`<h2>Mục III — ba chân dung, mỗi chân dung bốn mốc</h2>
  <p class="lede">Hộ dùng gì, ai cài, ai đào tạo, mất bao nhiêu phút, tốn bao nhiêu, và vì sao có thể bỏ cuộc.</p>
  <div class="pick">${SM.tenantIds().map(id=>{const x=SM.tenant(id);
    return `<button data-ho="${E(id)}" class="${id===HO?'on':''}">${E(x.ma)} — ${E(x.nganh)}
      <small>${E(x.diaBan)} · ${E(x.khongGian)}</small></button>`;}).join('')}</div>`;

  h+=`<div class="card"><div class="hd"><h4>${E(t.name)}</h4>
      <span class="sub">${E(t.chuHo)} · thế hệ kế cận ${E(t.keCan.ten)} (${t.keCan.tuoi} tuổi)</span></div>
    <div class="bd">
      <p style="margin-bottom:10px"><b>Động lực chuyển đổi:</b> ${E(t.dongLuc)}</p>
      <div class="two">
        <div><div class="mono" style="font-size:11px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase">Người thao tác hằng ngày</div>
          <div style="font-size:13.5px;margin-top:4px">${E(t.keCan.ten)} — ${E(t.keCan.vaiTro)}</div></div>
        <div><div class="mono" style="font-size:11px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase">Người lớn tuổi trong hộ</div>
          ${t.nguoiLonTuoi.map(n=>`<div style="font-size:13.5px;margin-top:4px">${E(n.ten)} (${n.tuoi} tuổi) — ${E(n.vaiTro)}</div>`).join('')}</div>
      </div>
      <div class="note br" style="margin-top:12px">Vì bố mẹ cũng phải đứng quầy khi con đi vắng, ứng dụng có <b>hai mức giao diện trên cùng một tài khoản</b>: chế độ đơn giản chữ lớn chỉ Bán và Xem tiền, và chế độ đầy đủ cho thế hệ kế cận. Bấm nút <span class="mono">Aa</span> trên ứng dụng để đổi.</div>
    </div></div>`;

  h+=`<div class="kpis">
    <div><div class="k">Doanh thu từ đầu năm</div><div class="v">${E(F.dShort(pos.yearRev))}</div><div class="n">tính từ giao dịch</div></div>
    <div><div class="k">Ngưỡng máy tính tiền</div><div class="v" style="font-size:15px;font-weight:660;color:${pos.thuocDien?'var(--crit)':pos.sapVuot?'var(--warn)':'var(--ok)'}">${pos.thuocDien?'Thuộc diện':pos.sapVuot?'Sắp vượt':'Dưới ngưỡng'}</div><div class="n">ước cả năm ${E(F.dShort(pos.projected))}</div></div>
    <div><div class="k">Thuế tạm tính quý ${SM.CLOCK.quarter}</div><div class="v">${E(F.dShort(est.total))}</div><div class="n">cập nhật khi bán</div></div>
    <div><div class="k">Chi phí năm 1 · giá sỉ</div><div class="v">${E(F.dShort(gia.nam1.si))}</div><div class="n">gồm triển khai tại chỗ</div></div>
    <div><div class="k">Hộ tự trả từ năm 3</div><div class="v">${E(F.dShort(gia.nam3))}</div><div class="n">mỗi năm, biết trước</div></div>
  </div>`;

  h+=`<div class="mocs">${P.MOC.map(m=>{const d=hj[m.id];
    return `<div class="moc">
      <div class="top"><b>${E(m.ten)}</b><span>${E(m.phu)}</span></div>
      <div class="mins"><b class="num">${d.phut}′</b><span>${E(d.phutGhiChu)}</span></div>
      <div class="seg"><div class="k">Hộ dùng gì</div>${E(d.congCu)}</div>
      <div class="seg"><div class="k">Ai cài · ai đào tạo</div>${E(d.aiCai)}<br><span style="color:var(--ink2)">${E(d.aiDaoTao)}</span></div>
      <div class="seg risk"><div class="k">Điều gì khiến hộ bỏ cuộc</div>${E(d.ruiRo)}</div>
      <div class="seg fix"><div class="k">Phòng ngừa</div>${E(d.phongNgua)}</div>
    </div>`;}).join('')}</div>`;

  h+=`<h3>Chi phí từng cấu phần cho chân dung này</h3>
    <div class="card"><div class="scrollx"><table>
      <thead><tr><th>Cấu phần</th><th class="r">Giá niêm yết</th><th class="r">Giá sỉ Chương trình</th><th class="r">Hộ tự trả từ năm 3</th></tr></thead>
      <tbody>${gia.dong.map(d=>`<tr class="${d.mienPhi?'free':''}">
        <td>${E(d.ten)}${d.mienPhi?' <span class="tag ok">miễn phí quốc gia</span>':''}${d.motLan?' <span class="tag br">một lần, năm 1</span>':''}
          ${d.nguon?`<div style="font-size:11.5px;color:var(--ink3)">${E(d.nguon)}</div>`:''}</td>
        <td class="r num">${d.niemYet?E(F.d(d.niemYet)):'0đ'}</td>
        <td class="r num">${d.si?E(F.d(d.si)):'0đ'}</td>
        <td class="r num">${d.nam3?E(F.d(d.nam3)):'0đ'}</td></tr>`).join('')}
      </tbody>
      <tfoot>
        <tr><td>Thuê bao hằng năm</td><td class="r num">${E(F.d(gia.hangNam.niemYet))}</td><td class="r num">${E(F.d(gia.hangNam.si))}</td><td class="r num">${E(F.d(gia.nam3))}</td></tr>
        <tr><td>Triển khai tại chỗ, chỉ năm 1</td><td class="r num">${E(F.d(gia.motLan.niemYet))}</td><td class="r num">${E(F.d(gia.motLan.si))}</td><td class="r num">0đ</td></tr>
        <tr><td><b>Năm thứ nhất</b></td><td class="r num"><b>${E(F.d(gia.nam1.niemYet))}</b></td><td class="r num"><b>${E(F.d(gia.nam1.si))}</b></td><td class="r">—</td></tr>
      </tfoot></table></div></div>`;
  return h;
}

/* ══════════════════════════════ GIÁ VÀ MÔ HÌNH GIÁ ═════════════════════ */
function secGia(){
  let h=`<h2>Ràng buộc IV.9 và tư vấn ngược V.2</h2>
  <p class="lede">Công bố cả ba mức giá, và nói rõ phần nào không được tính tiền.</p>
  <div class="note ok"><b>Nguyên tắc II.2 áp dụng thật:</b> tầng tuân thủ đã được Nhà nước và thị trường cấp miễn phí thì để <b>0đ</b> ở cả ba cột — không gói vào thuê bao rồi tính chung. Phần thu phí nằm ở tầng vận hành và bán hàng.</div>
  <div class="note br">${E(P.GIA.dieuKienGiaSi)}. <span style="opacity:.8">${E(P.GIA.nguonDieuKien)}</span></div>`;

  P.GIA.nhom.forEach(n=>{
    h+=`<div class="card"><div class="hd"><h4>${E(n.ten)}</h4>
      ${n.mienPhi?'<span class="tag ok">không tính tiền</span>':''}
      ${n.motLan?'<span class="tag br">một lần</span>':''}
      ${n.theoGiaoDich?'<span class="tag warn">theo giao dịch</span>':''}</div>
      <div class="bd" style="padding-bottom:0"><p style="font-size:13.5px;color:var(--ink2)">${E(n.ghiChu)}</p></div>
      <div class="scrollx"><table>
        <thead><tr><th>Cấu phần</th><th class="r">Niêm yết</th><th class="r">Giá sỉ Chương trình</th><th class="r">Hộ tự trả từ năm 3</th></tr></thead>
        <tbody>${n.dong.map(d=>`<tr class="${n.mienPhi?'free':''}">
          <td>${E(d.ten)}${d.nganh?` <span class="tag br">${E(d.nganh)}</span>`:''}
            ${d.nguon?`<div style="font-size:11.5px;color:var(--ink3)">${E(d.nguon)}</div>`:''}</td>
          <td class="r num">${d.niemYet?E(F.num(d.niemYet))+(d.donVi?'':'đ'):'0đ'}${d.donVi?`<div style="font-size:11px;color:var(--ink3)">${E(d.donVi)}</div>`:''}</td>
          <td class="r num">${d.si?E(F.num(d.si))+(d.donVi?'':'đ'):'0đ'}</td>
          <td class="r num">${d.nam3?E(F.num(d.nam3))+(d.donVi?'':'đ'):'0đ'}</td></tr>`).join('')}
        </tbody></table></div></div>`;
  });

  h+=`<h3>Lộ trình chi phí ba chân dung — hộ biết trước từ khi tham gia</h3>
    <div class="card"><div class="scrollx"><table>
      <thead><tr><th>Chân dung</th><th class="r">Năm 1 · ngân sách 100%</th><th class="r">Năm 2 · ngân sách 50%</th><th class="r">Năm 3 · hộ tự trả</th><th class="r">Đề xuất năm 2 hộ trả</th></tr></thead>
      <tbody>${SM.tenantIds().map(id=>{const t=SM.tenant(id),g=P.tinhGia(t.nganh);
        return `<tr><td><b>${E(t.ma)}</b> — ${E(t.nganh)}</td>
          <td class="r num">${E(F.d(g.nam1.si))}<div style="font-size:11px;color:var(--ink3)">hộ trả 0đ</div></td>
          <td class="r num">${E(F.d(g.nam2.si))}<div style="font-size:11px;color:var(--ink3)">ngân sách</div></td>
          <td class="r num">${E(F.d(g.nam3))}</td>
          <td class="r num">${E(F.d(Math.round(g.hangNam.si*0.25)))}<div style="font-size:11px;color:var(--warn)">25% để thành thói quen</div></td></tr>`;
      }).join('')}</tbody></table></div></div>`;

  h+=`<h3>Tư vấn ngược V.2 — phản biện lại thiết kế của Chương trình</h3>
    <div class="note br"><b>Đề xuất mô hình:</b> ${E(P.MO_HINH_GIA.deXuat)}</div>`;
  P.MO_HINH_GIA.phanBien.forEach(x=>{
    h+=`<div class="card"><div class="hd"><h4>${E(x.diem)}</h4></div><div class="bd">
      <p style="margin-bottom:9px">${E(x.noiDung)}</p>
      <div class="note ok" style="margin:0"><b>Đề xuất thay:</b> ${E(x.thay)}</div>
    </div></div>`;
  });
  h+=`<div class="note warn"><b>Mô hình nào giữ chân hộ tốt hơn:</b> ${E(P.MO_HINH_GIA.giuChan)}</div>`;
  return h;
}

function secDuongDi() {
  var nguon = SM.inbox.NGUON || {};
  var kichBan = SM.inbox.KICH_BAN || [];
  var skTheoNguon = {};
  kichBan.forEach(function (kb) {
    if (!kb || !kb.nguonId) return;
    if (!skTheoNguon[kb.nguonId]) skTheoNguon[kb.nguonId] = [];
    skTheoNguon[kb.nguonId].push(kb);
  });
  function taoRa(tenSk) {
    var t = (tenSk || '').toLowerCase();
    if (t.indexOf('đơn') >= 0) return 'Đơn hàng mới trong sổ bán, chờ hộ xử lý';
    if (t.indexOf('hoá đơn') >= 0 || t.indexOf('hóa đơn') >= 0) return 'Hồ sơ phát hành hoá đơn điện tử';
    if (t.indexOf('tin nhắn') >= 0 || t.indexOf('hội thoại') >= 0 || t.indexOf('chat') >= 0) return 'Cuộc hội thoại trong Hộp thư đến';
    if (t.indexOf('vận') >= 0) return 'Trạng thái vận đơn gắn vào đơn hàng';
    if (t.indexOf('thuế') >= 0 || t.indexOf('thue') >= 0) return 'Thông báo và việc cần làm liên quan thuế';
    if (t.indexOf('đặt') >= 0 || t.indexOf('dat') >= 0) return 'Lượt đặt chỗ trong lịch';
    if (t.indexOf('kho') >= 0) return 'Điều chỉnh tồn kho theo lô';
    if (t.indexOf('cọc') >= 0) return 'Tiền cặp giao dịch giữ chỗ';
    if (t.indexOf('duyệt') >= 0) return 'Kết quả duyệt ghi nhận vào sổ tương ứng';
    if (t.indexOf('biểu') >= 0 || t.indexOf('gia') >= 0) return 'Bảng giá mới áp dụng cho lần bán kế tiếp';
    return 'Bản ghi nghiệp vụ tương ứng trong sổ của hộ';
  }
  var phanA = '';
  Object.keys(nguon).forEach(function (id) {
    var n = nguon[id];
    if (!n) return;
    var sks = skTheoNguon[id] || [];
    var laThue = (id === 'CQT' || (n.ten || '').toLowerCase().indexOf('thuế') >= 0 || (n.ten || '').toLowerCase().indexOf('co quan thue') >= 0);
    if (sks.length === 0 && !laThue) return;
    var suKien, tao;
    if (sks.length > 0) {
      suKien = sks.map(function (kb) { return E(kb.ten || ''); }).join(' · ');
      tao = sks.map(function (kb) { return E(taoRa(kb.ten)); }).join(' · ');
    } else {
      suKien = '<span class="tag warn">chưa có kịch bản nối sẵn</span>';
      tao = '<span class="tag warn">chờ kết nối theo quy định</span>';
    }
    phanA += '<tr>'
      + '<td><strong>' + E(n.ten || id) + '</strong><br><span class="muted">' + E(n.loai || '') + '</span></td>'
      + '<td>' + E(n.kenh || '') + '</td>'
      + '<td><span class="clause">' + E(n.endpoint || '') + '</span></td>'
      + '<td>' + suKien + '</td>'
      + '<td>' + tao + '</td>'
      + '</tr>';
  });
  var phanB = ''
    + '<tr><td>Truyền hoá đơn điện tử</td><td>Hệ thống hoá đơn có kết nối cơ quan thuế</td><td>Ngay khi phát hành</td><td>Xếp hàng đợi, tự gửi khi có mạng, không phát hành trùng</td></tr>'
    + '<tr><td>Xác nhận đơn và mã vận đơn về kênh bán</td><td>Sàn thương mại điện tử và hãng vận chuyển</td><td>Khi nhận đơn và khi gán vận chuyển</td><td>Xếp hàng đợi</td></tr>'
    + '<tr><td>Trả lời tin nhắn khách</td><td>Zalo OA</td><td>Khi hộ bấm gửi</td><td>Xếp hàng đợi</td></tr>'
    + '<tr><td>Báo cáo tổng hợp định kỳ</td><td>Bảng điều khiển Chương trình</td><td>Theo lịch đã thống nhất</td><td>Gửi bù kỳ sau, có mã băm nối chuỗi để đối chiếu</td></tr>';
  return '<h2>Đường đi dữ liệu</h2>'
    + '<p class="lede">Mọi dữ liệu vào và ra đều xem được ai gửi, qua đường nào, nội dung thô là gì, và nó tạo ra cái gì trong sổ của hộ.</p>'
    + '<div class="card"><div class="hd"><h4>A. Dữ liệu đi vào</h4><p class="sub">Nguồn ngoài đẩy vào, hệ thống ghi lại toàn vẹn</p></div>'
    + '<div class="bd"><div class="scrollx"><table>'
    + '<tr><th>Nguồn</th><th>Đường vào</th><th>Địa chỉ nhận</th><th>Sự kiện</th><th>Tạo ra gì</th></tr>'
    + phanA
    + '</table></div></div></div>'
    + '<div class="card"><div class="hd"><h4>B. Dữ liệu đi ra</h4><p class="sub">Chỉ gửi khi có việc thật, mất mạng thì xếp hàng đợi</p></div>'
    + '<div class="bd"><div class="scrollx"><table>'
    + '<tr><th>Việc</th><th>Gửi đi đâu</th><th>Khi nào gửi</th><th>Nếu mất mạng thì sao</th></tr>'
    + phanB
    + '</table></div></div></div>'
    + '<div class="note br">Nền tảng <strong>không tự nộp thuế</strong> và <strong>không tự chuyển tiền</strong>. Hai việc đó người chịu trách nhiệm phải tự bấm xác nhận; nền tảng chỉ chuẩn bị sẵn số và lưu mã biên nhận để đối chiếu.</div>'
    + '<div class="note warn">Hộ xuất được toàn bộ dữ liệu của mình bất cứ lúc nào, định dạng mở, để chuyển sang nhà cung cấp khác mà không bị khóa lại.</div>';
}

function render(){
  $('#tabs').innerHTML=TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===TAB?'on':''}">
    ${E(t.ten)}<span class="cl">${E(t.cl)}</span></button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();window.scrollTo(0,0);});
  const f={moc:secMoc,gia:secGia,ketnoi:secKetnoi,nguoi:secNguoi,nghe:secNghe,demo:secDemo,matran:secMatran,bando:secBanDo,duongdi:secDuongDi}[TAB];
  $('#app').innerHTML='<section>'+f()+`</section><footer>
