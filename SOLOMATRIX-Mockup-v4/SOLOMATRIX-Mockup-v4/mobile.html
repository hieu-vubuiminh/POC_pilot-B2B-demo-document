<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6360">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SoloMatrix">
<title>SoloMatrix — Bán hàng và kê khai trên điện thoại</title>
<style>
:root{
  --bg:#F2F4F3; --card:#FFFFFF; --sunk:#E9ECEB;
  --ink:#14191B; --ink2:#4A5457; --ink3:#788386;
  --line:#DCE0DE; --line2:#BEC5C2;
  --brand:#0E6360; --brand-soft:#E3EEED; --brand-ink:#0A4A48;
  --ok:#2C6238; --ok-soft:#E5EFE7;
  --warn:#8A5B10; --warn-soft:#FAF0DC;
  --crit:#A32E24; --crit-soft:#F9E7E4;
  --r:14px; --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
#phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;
  display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
@media(min-width:900px){
  body{background:#DDE2E0;padding:18px 0}
  #phone{min-height:calc(100vh - 36px);border-radius:26px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.22)}
}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff}
.hrow{display:flex;align-items:center;gap:8px;padding:10px 12px}
.hrow .who{flex:1;min-width:0}
.hrow .who b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .who span{display:block;font-size:11.5px;opacity:.85}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:#fff;color:var(--brand);border-color:#fff}
.netbar{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;background:var(--brand-ink)}
.netbar .dot{width:8px;height:8px;border-radius:50%;background:#7CD9A0;flex:none}
.netbar.off{background:var(--crit)} .netbar.off .dot{background:#FFD9D3}
.netbar .q{margin-left:auto;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:999px;font-weight:600}

main{flex:1;padding:12px 12px 100px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>.hd h2{margin:0;font-size:14px;font-weight:680;flex:1}
.card>.hd .sub{font-size:11.5px;color:var(--ink3);font-weight:500}
.card>.bd{padding:12px 14px}
.card>.bd.tight{padding:0}
.muted{color:var(--ink3);font-size:12.5px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mid{font-size:20px;font-weight:680}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap} .sp{margin-left:auto}
.list>*{padding:11px 14px;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:none}

.btn{min-height:var(--tap);border:1px solid var(--line2);background:var(--card);border-radius:12px;
  padding:0 16px;font-size:15px;font-weight:620;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dan{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.gh{background:transparent} .btn.w{width:100%}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}

.tag{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.tag.br{background:var(--brand-soft);color:var(--brand)}
.tag.gray{background:var(--sunk);color:var(--ink3)}

.note{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.note.warn{background:var(--warn-soft);color:#5E3E08;border:1px solid #EBD5A8}
.note.crit{background:var(--crit-soft);color:#78221A;border:1px solid #EBBFB8}
.note.ok{background:var(--ok-soft);color:#1F4A28;border:1px solid #BCD8C3}
.note.br{background:var(--brand-soft);color:var(--brand-ink);border:1px solid #B9D8D6}

input,select,textarea{width:100%;min-height:var(--tap);border:1px solid var(--line2);border-radius:11px;
  padding:10px 12px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:74px;resize:vertical}
label{display:block;font-size:12px;font-weight:640;color:var(--ink2);margin:0 0 5px}
.fld{margin-bottom:11px}
.fld.bad input,.fld.bad select{border-color:var(--crit);background:var(--crit-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:900px){nav{position:absolute}}
nav button{flex:1;border:none;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:620;color:var(--ink3);min-height:58px;position:relative}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--brand)}
nav button .bdg{position:absolute;top:4px;left:50%;margin-left:4px;background:var(--crit);color:#fff;
  font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 5px}

#fab{position:fixed;right:14px;bottom:76px;z-index:45;width:56px;height:56px;border-radius:50%;
  background:var(--brand);color:#fff;border:none;box-shadow:0 6px 18px rgba(14,99,96,.4);
  font-size:24px;display:flex;align-items:center;justify-content:center}
@media(min-width:900px){#fab{position:absolute}}
#fab.hide{display:none}

body.simple{font-size:19px}
body.simple .big{font-size:38px}
body.simple .btn{min-height:64px;font-size:19px;border-radius:14px}
body.simple .card>.hd h2{font-size:17px}
body.simple nav button{font-size:13px;min-height:70px}
body.simple nav button .ic{font-size:26px}
body.simple .muted{font-size:15px}
body.simple .hide-simple{display:none !important}
body.simple #fab{display:none}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(12,18,20,.5);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:900px){.sheet{position:absolute}}
.sheet .inner{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--bg);
  border-radius:18px 18px 0 0;padding:14px 14px 24px}
.sheet h3{margin:2px 0 12px;font-size:17px;font-weight:700}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink);
  color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;max-width:92%;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media(min-width:900px){.toast{position:absolute}}

.bar{height:7px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.bar.full>i{background:var(--crit)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);
  padding:8px 10px;background:var(--sunk);font-weight:650}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
.scrollx{overflow-x:auto}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 13px;
  font-size:12.5px;font-weight:620;white-space:nowrap}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mi{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);width:100%;
  border-left:none;border-right:none;border-top:none;background:var(--card);text-align:left}
.mi:last-child{border-bottom:none}
.mi .ic{font-size:21px;width:28px;text-align:center;flex:none}
.mi .tx{flex:1;min-width:0}
.mi .tx b{display:block;font-size:14.5px;font-weight:640}
.mi .tx span{display:block;font-size:12px;color:var(--ink3)}
.mi .ar{color:var(--ink3);font-size:18px}
</style>
</head>
<body>
<div id="phone">
  <header>
    <div class="hrow">
      <button class="chip" id="btnWho" aria-label="Đổi chân dung hộ">☰</button>
      <span class="who" id="who"><b>—</b><span>—</span></span>
      <button class="chip" id="btnMode" aria-label="Đổi cỡ chữ">Aa</button>
    </div>
    <div class="netbar" id="netbar">
      <span class="dot"></span><span id="netTxt">Có mạng</span>
      <button class="chip sp" id="btnAir" style="padding:3px 10px;font-size:11.5px">✈︎ Chế độ máy bay</button>
      <span class="q" id="qCount">0</span>
    </div>
  </header>
  <main id="view"></main>
  <button id="fab" aria-label="Hỏi trợ lý">💬</button>
  <nav id="nav"></nav>
</div>

<script src="js/sm-core.js?v=20260820c"></script>
<script src="js/sm-domain.js?v=20260820c"></script>
<script src="js/sm-inbox.js?v=20260820c"></script>
<script src="js/sm-ops.js?v=20260820c"></script>
<script src="js/sm-quyen.js?v=20260820c"></script>
<script src="js/sm-onboard.js?v=20260820c"></script>
<script src="js/sm-seed-gialai.js?v=20260820c"></script>
<script src="js/sm-ai.js?v=20260820c"></script>
<script src="js/sm-program.js?v=20260820c"></script>
<script>
(function(){
'use strict';
const D=SM.dom,P=SM.prog,AI=SM.ai,O=SM.ops,Q=SM.quyen,F=SM.fmt,E=F.esc;
const ON=SM.onb||{}; /* js/sm-onboard.js (W1) — wizard mở màn + Trạm kết nối; thiếu file thì app vẫn boot, chỉ các màn wizard chưa có */
const $=s=>document.querySelector(s);
let TAB='ban', cart=[], chat=[], donLoc='all';

function toast(m,ms){const o=$('.toast');if(o)o.remove();
  const el=document.createElement('div');el.className='toast';el.textContent=m;
  document.body.appendChild(el);setTimeout(()=>el.remove(),ms||2600);}
function sheet(title,html,after){closeSheet();
  const w=document.createElement('div');w.className='sheet';
  w.innerHTML='<div class="inner"><div class="row"><h3 style="flex:1">'+E(title)+'</h3><button class="btn sm gh" data-x>Đóng</button></div>'+html+'</div>';
  w.addEventListener('click',e=>{if(e.target===w||e.target.hasAttribute('data-x'))closeSheet();});
  document.body.appendChild(w);if(after)after(w);return w;}
function closeSheet(){const s=$('.sheet');if(s)s.remove();}

/* ═══ THANH TAB — 5 chỗ, đổi theo ngành (V.1: một gói chung, cấu hình được) ═══ */
function tabsFor(t){
  if(SM.mode()==='simple') return [
    {id:'ban',ic:'🛒',ten:'Bán'},{id:'tien',ic:'💰',ten:'Tiền'},{id:'ai',ic:'💬',ten:'Trợ lý'}];
  const t2=(t.resources||[]).length?{id:'lich',ic:'📅',ten:'Lịch'}
          :(t.purchases||[]).length?{id:'mua',ic:'🧾',ten:'Thu mua'}
          :{id:'kho',ic:'📦',ten:'Kho'};
  return [{id:'ban',ic:'🛒',ten:'Bán'},t2,{id:'don',ic:'🚚',ten:'Đơn'},
          {id:'tien',ic:'💰',ten:'Tiền'},{id:'them',ic:'⋯',ten:'Thêm'}];
}
function renderNav(){
  const t=SM.current(),tabs=tabsFor(t);
  const chuaXuLy=(t.orders||[]).filter(o=>o.state==='new'||o.state==='picking').length;
  const canhBao=D.deadlines(t).filter(x=>x.trangThai==='todo').length;
  /* Vào màn con thì không tab nào sáng, người dùng mất định hướng — nay sáng "Thêm"
     vì mọi màn con đều vào từ đó (trừ vài màn có lối tắt riêng). */
  const cha=tabs.some(x=>x.id===TAB)?TAB:'them';
  $('#nav').innerHTML=tabs.map(x=>{
    const b=x.id==='don'?chuaXuLy:x.id==='tien'?canhBao:x.id==='them'?SM.inbox.unread(t.id):0;
    return `<button data-tab="${x.id}" class="${x.id===cha?'on':''}">
      <span class="ic">${x.ic}</span>${E(x.ten)}${b?`<span class="bdg">${b}</span>`:''}</button>`;}).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();});
  $('#fab').className=(TAB==='ai'||SM.mode()==='simple')?'hide':'';
}
function renderHead(){
  const t=SM.current(),on=SM.isOnline();
  $('#who').innerHTML=`<b>${E(t.name)}</b><span>${E(t.ma)} · ${E(t.diaBan)} · ${E(t.nganh)}</span>`;
  $('#netbar').className='netbar'+(on?'':' off');
  $('#netTxt').textContent=on?'Có mạng — dữ liệu đang gửi lên':'MẤT MẠNG — vẫn bán được, gửi lên sau';
  const q=SM.queueCount();
  $('#qCount').textContent=q?(q+' chờ gửi'):'đã gửi hết';
  $('#btnAir').className='chip'+(on?'':' on');
  document.body.className=SM.mode()==='simple'?'simple':'';
}

/* ═══ CẢNH BÁO CHỦ ĐỘNG (IV.5) ═══ */
function alertsCard(t,max){
  const dl=D.deadlines(t); if(!dl.length) return '';
  return `<div class="card"><div class="hd"><h2>Việc cần để ý</h2><span class="sub">${dl.length} mục</span></div>
  <div class="bd tight list">${dl.slice(0,max||(SM.mode()==='simple'?2:4)).map(x=>{
    const c=x.trangThai==='todo'?'crit':x.trangThai==='warn'?'warn':'ok';
    return `<div class="row" style="align-items:flex-start">
      <span class="tag ${c}" style="margin-top:2px">${x.conLai!==null&&x.conLai!==undefined?(x.conLai<0?'quá hạn':x.conLai+' ngày'):'!'}</span>
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${E(x.ten)}</div>
      ${x.soTien?`<div class="muted num">${E(F.d(x.soTien))}</div>`:''}
      ${x.han?`<div class="muted">Hạn ${E(F.dmy(x.han))}</div>`:''}</div>
      ${x.dichDen?`<button class="btn sm gh" data-di="${E(x.dichDen)}">Xem</button>`:''}</div>`;}).join('')}
  </div></div>`;
}

/* ═══ SÁNG NAY CẦN ĐỂ Ý (D-#11): gom hạn sắp đến + sự kiện mới + hàng đợi gửi —
   tối đa 5 mục, mỗi mục 1 chạm tới đúng màn, không mục nào là chữ chết ═══ */
function sangNayCard(t){
  const dl=D.deadlines(t).filter(x=>x.dichDen).slice(0,3);
  const chuaDoc=SM.inbox.unread(t.id);
  const moiNhat=chuaDoc?SM.inbox.list(t.id).find(e=>e.trangThai==='moi'):null;
  const q=SM.queueCount();
  const muc=[];
  dl.forEach(x=>muc.push({
    lop:x.trangThai==='todo'?'crit':x.trangThai==='warn'?'warn':'ok',
    tag:(x.conLai!==null&&x.conLai!==undefined)?(x.conLai<0?'quá hạn':x.conLai+' ngày'):'!',
    ten:x.ten,duoi:x.han?'Hạn '+F.dmy(x.han):'',di:x.dichDen}));
  if(chuaDoc)muc.push({lop:'crit',tag:'mới',ten:chuaDoc+' sự kiện mới trong hộp thư',
    duoi:moiNhat?moiNhat.tieuDe:'',di:'hopthu'});
  if(q)muc.push({lop:'warn',tag:'chờ gửi',ten:q+' việc chờ gửi khi có mạng',
    duoi:'xem trạng thái từng việc trong Hộp thư đến',di:'hopthu'});
  if(!muc.length)return '';
  return `<div class="card"><div class="hd"><h2>Sáng nay cần để ý</h2><span class="sub">${muc.length} mục · chạm để đi thẳng</span></div>
  <div class="bd tight list">${muc.map(m=>`<div class="row" style="align-items:flex-start">
    <span class="tag ${m.lop}" style="margin-top:2px">${E(m.tag)}</span>
    <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${E(m.ten)}</div>
    ${m.duoi?`<div class="muted">${E(m.duoi)}</div>`:''}</div>
    <button class="btn sm gh" data-di="${E(m.di)}">Xem</button></div>`).join('')}
  </div></div>`;
}

/* ════════════════════════════ TAB BÁN ════════════════════════════ */
function viewBan(t){
  const pos=D.needsPosInvoice(t),st=D.stockAll(t),qr=D.qrPoints(t,SM.CLOCK.today);
  const tong=cart.reduce((s,c)=>s+c.qty*c.price,0);
  let h='';
  /* W0 #1 (CHẮN): hộ trắng bấm «Để sau» không được rơi vào màn trống — luôn có thẻ chào + đường vào wizard */
  if((!t.skus||!t.skus.length)&&(!t.orders||!t.orders.length)){
    h+=`<div class="card"><div class="bd">
      <div style="font-weight:700;font-size:16px">Máy chưa biết nhà mình bán gì</div>
      <div class="muted" style="margin:6px 0 10px">Làm phần mở đầu chừng 5 phút là máy dọn hàng, dọn sổ cho nhà mình. Chưa muốn làm thì cứ xem quanh — phần mở đầu luôn chờ ở đây.</div>
      <button class="btn" data-di="obkichhoat" style="width:100%">Bắt đầu — chừng 5 phút</button>
      <div class="muted" style="margin-top:8px">Muốn xem hộ mẫu đang dùng ra sao: bấm nút ☰ ở góc trên.</div>
    </div></div>`;
  }
  h+=sangNayCard(t);
  h+=alertsCard(t);
  h+=`<div class="card"><div class="bd">
    <div class="muted">Thu hôm nay ${E(F.dmy(SM.CLOCK.today))}</div>
    <div class="big num">${E(F.d(qr.total))}</div>
    <div class="muted">${qr.count} lượt thanh toán${qr.points.length>1?` tại ${qr.points.filter(p=>p.count).length}/${qr.points.length} điểm`:''}</div>
  </div></div>`;
  if(qr.points.length>1){
    h+=`<div class="card"><div class="hd"><h2>Doanh thu các điểm</h2><span class="sub">hợp nhất theo thời gian thực</span></div>
    <div class="bd tight list">${qr.points.map(p=>`<div class="row"><div style="flex:1">
      <div style="font-weight:600;font-size:14px">${E(p.ten)}</div><div class="muted">${E(p.diaChi)} · ${p.count} lượt</div></div>
      <div class="mid num">${E(F.dShort(p.revenue))}</div></div>`).join('')}</div></div>`;
  }
  h+=pos.thuocDien
    ? `<div class="note br">Hộ <b>thuộc diện</b> dùng hoá đơn điện tử khởi tạo từ máy tính tiền — doanh thu đầu năm ${E(F.d(pos.yearRev))}, trên ngưỡng ${E(F.dShort(pos.nguong))}.</div>`
    : pos.sapVuot ? `<div class="note warn"><b>Sắp tới ngưỡng.</b> Đầu năm ${E(F.d(pos.yearRev))}, ước cả năm ${E(F.d(pos.projected))} — trên ${E(F.dShort(pos.nguong))}. Nên chuẩn bị trước.</div>`:'';

  h+=`<div class="card"><div class="hd"><h2>Bán tại quầy</h2><span class="sub">${SM.isOnline()?'trực tuyến':'mất mạng — vẫn bán được'}</span></div>
  <div class="bd tight"><div class="list">
  ${st.map(s=>{const inC=cart.find(c=>c.sku===s.sku),dv=s.meta.dichVu,het=!dv&&s.available<=0;
    return `<div class="row"><div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:14px">${E(s.meta.name)}${s.meta.baoQuan==='lanh'?' <span class="tag br">giữ lạnh</span>':''}</div>

function bindBan(t){
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const sku=b.dataset.add,meta=(t.skus||[]).find(s=>s.sku===sku),st=D.stock(t,sku),c=cart.find(x=>x.sku===sku);
    if((c?c.qty:0)+1>st.available){toast('Chỉ còn '+F.num(st.available)+' '+meta.unit);return;}
    if(c)c.qty++;else cart.push({sku,qty:1,price:meta.price,name:meta.name,unit:meta.unit});render();});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{
    const c=cart.find(x=>x.sku===b.dataset.dec);if(!c)return;c.qty--;if(c.qty<=0)cart=cart.filter(x=>x!==c);render();});
  const cc=$('#clearCart');if(cc)cc.onclick=()=>{cart=[];render();};
  const pay=$('#pay');if(pay)pay.onclick=()=>doPay(t);
  const po=$('#payOrg');if(po)po.onclick=()=>orgInvoiceSheet(t,{
    id:'BAN-TAI-QUAY',lines:cart.map(c=>({sku:c.sku,qty:c.qty,amount:c.qty*c.price})),
    total:cart.reduce((s,c)=>s+c.qty*c.price,0),channel:'quay'},()=>{cart=[];});
  const ti=$('#toInbox');if(ti)ti.onclick=()=>{TAB='hopthu';render();};
}

    ${!SM.isOnline()?'<div class="note warn" style="margin-top:10px"><b>Đang mất mạng.</b> Vẫn thu tiền và lập hoá đơn được, hoá đơn xếp hàng đợi.</div>':''}

  w=>{w.querySelector('#doneP').onclick=()=>{
    const inv=D.issueInvoice(t,{fromPos:pos.thuocDien,channel:'quay',
      lines:cart.map(c=>({sku:c.sku,qty:c.qty,amount:c.qty*c.price})),total:tong,buyer:'Khách lẻ không lấy hoá đơn'});
    t.payments=t.payments||[];t.payments.push({date:SM.CLOCK.today,point:(t.qrPoints||[{id:'q1'}])[0].id,amount:tong,method:'QR'});
    SM.save();cart=[];closeSheet();

}
/* Hoá đơn cho khách TỔ CHỨC — động lực chuyển đổi của cả ba chân dung */
function orgInvoiceSheet(t,src,after){
  if(!src.total){toast('Chưa có món nào để xuất hoá đơn');return;}
  const goiY=(t.receivables||[]).map(r=>r.buyer).concat((t.recurring||[]).map(r=>r.buyer))
    .filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);
  sheet('Hoá đơn cho khách có mã số thuế',
    `<div class="note br">Đây là thứ nhà hàng, khách sạn, công ty lữ hành và doanh nghiệp chế biến yêu cầu để đưa hộ vào danh sách nhà cung cấp chính thức.</div>
     <div class="card" style="margin-top:12px"><div class="bd">
       <div class="muted">Giá trị hoá đơn</div><div class="mid num">${E(F.d(src.total))}</div></div></div>
     <div class="fld" style="margin-top:12px"><label>Tên đơn vị mua</label><input id="bTen" placeholder="Ví dụ: Khách sạn Hải Âu"></div>
     ${goiY.length?`<div class="row wrap" style="gap:6px;margin:-4px 0 11px">${goiY.map(g=>`<button class="btn sm gh" data-goiy="${E(g)}">${E(g)}</button>`).join('')}</div>`:''}
     <div class="grid2"><div class="fld"><label>Mã số thuế</label><input id="bMst" inputmode="numeric" placeholder="Bắt buộc"></div>
     <div class="fld"><label>Địa chỉ</label><input id="bDc" placeholder="Địa chỉ đơn vị"></div></div>
     <div class="fld"><label>Thanh toán</label><select id="bTt">
       <option value="ngay">Trả ngay</option><option value="30">Công nợ 30 ngày</option><option value="15">Công nợ 15 ngày</option></select></div>
     <button class="btn pri w" id="bXuat">Xuất hoá đơn</button>`,
  w=>{
    w.querySelectorAll('[data-goiy]').forEach(b=>b.onclick=()=>{w.querySelector('#bTen').value=b.dataset.goiy;});
    w.querySelector('#bXuat').onclick=()=>{
      const ten=w.querySelector('#bTen').value.trim(),mst=w.querySelector('#bMst').value.trim();
      if(!ten||!mst){
        if(!ten)w.querySelector('#bTen').parentElement.className='fld bad';
        if(!mst)w.querySelector('#bMst').parentElement.className='fld bad';
        toast('Khách tổ chức bắt buộc có tên đơn vị và mã số thuế');return;}
      const tt=w.querySelector('#bTt').value;
      const inv=D.invoiceForOrg(t,src,{ten,mst,diaChi:w.querySelector('#bDc').value.trim(),
        traSau:tt!=='ngay',soNgay:tt==='ngay'?0:parseInt(tt,10)});
      closeSheet();if(after)after(inv);
      toast('Đã xuất '+inv.id+' cho '+ten+(tt!=='ngay'?' — đã ghi công nợ':''));render();};});
}

      <div class="row" style="align-items:flex-start">

        </div>

function bindAi(t){
  const doAsk=q=>{if(!q||!q.trim())return;chat.push(AI.ask(q.trim(),t));render();};
  const ab=$('#askBtn');if(ab)ab.onclick=()=>doAsk($('#q').value);
  const qi=$('#q');if(qi)qi.onkeydown=e=>{if(e.key==='Enter')doAsk(qi.value);};
  document.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>doAsk(b.dataset.sg));

    toast('Đang nghe... (bản demo dùng câu mẫu tiếng Việt)');
    setTimeout(()=>{mic.textContent='🎙';mic.disabled=false;
      const q=AI.suggestions(t)[Math.floor(Date.now()/1000)%3];$('#q').value=q;doAsk(q);},1400);};

      <div class="note warn" style="margin-top:12px">${E(l.canhBao)}</div>`);};
  const ga=$('#genAH');if(ga)ga.onclick=()=>{const r=AI.afterHoursReply(t);if(!r)return;
    sheet('Trợ lý trả khách ngoài giờ',`<div class="muted">${E(r.guiLuc)}</div>

/* ═══ HỘP THƯ ĐẾN — GLM dựng theo spec, Claude verify ═══ */
function viewHopThu(t) {
  var h = '';
  h += '<div class="note br">Mọi dữ liệu từ ngoài vào đều đi qua hộp thư này. Mỗi sự kiện ghi rõ ai gửi, đến bằng đường nào, nội dung thô nhận được và nó tạo ra thứ gì trong hệ thống.</div>';

  var kichBans = SM.inbox.scenarios(t);
  h += '<div class="card"><div class="hd">Giả lập sự kiện bên ngoài</div><div class="bd tight">';
  h += '<div class="note warn">Đây là nút để người xem tự bấm: dữ liệu đến từ bên ngoài qua đường thật, hộ kinh doanh không phải gõ tay gì cả.</div>';
  if (!kichBans.length) {
    h += '<div class="muted" style="padding:10px">Không có kịch bản nào.</div>';
  } else {
    for (var i = 0; i < kichBans.length; i++) {
      var kb = kichBans[i];
      h += '<div style="padding:10px">';
      h += '<button class="btn sm w" data-gl="' + E(kb.id) + '">' + E(kb.ten) + '</button>';
      h += '<div class="muted" style="margin-top:4px">' + E(kb.moTa) + '</div>';
      h += '<div class="muted mono" style="font-size:11px;margin-top:2px">' + E(kb.nguon.ten) + ' · ' + E(kb.nguon.endpoint) + '</div>';
      h += '</div>';
    }
  }
  h += '</div></div>';

  var ds = SM.inbox.list(t.id);
  h += '<div class="card"><div class="hd">Sự kiện đã đến</div><div class="bd tight list">';
  if (!ds.length) {
    h += '<div class="muted" style="padding:10px">Chưa có sự kiện nào. Hãy bấm một nút giả lập ở trên.</div>';
  } else {
    for (var j = 0; j < ds.length; j++) {
      var ev = ds[j];
      var ng = SM.inbox.nguonCua(ev);
      var nhan, nhanLop;
      if (ev.trangThai === 'moi') { nhan = 'mới'; nhanLop = 'tag crit'; }
      else if (ev.trangThai === 'da-xu-ly') { nhan = 'đã xử lý'; nhanLop = 'tag ok'; }
      else if (ev.trangThai === 'trung-bo') { nhan = 'trùng — đã bỏ'; nhanLop = 'tag gray'; }
      else { nhan = 'lỗi'; nhanLop = 'tag warn'; }
      h += '<button data-ev="' + E(ev.id) + '" style="width:100%;text-align:left;padding:10px">';
      h += '<span class="' + nhanLop + '">' + nhan + '</span> ';
      h += '<span>' + E(ev.tieuDe) + '</span>';
      h += '<div class="muted" style="margin-top:4px">' + E(ng.ten) + ' · ' + F.hm(ev.luc) + ' · ' + E(ng.kenh) + '</div>';
      if (ev.taoRa) {
        h += '<div class="muted">→ tạo ra: ' + E(ev.taoRa.moTa) + '</div>';
      }
      if (ev.trangThai === 'loi') {
        h += '<div class="note crit" style="margin-top:6px">' + E(ev.ghiChu) + '</div>';
      }
      h += '</button>';
    }
  }
  h += '</div></div>';

  var q = SM.queue();
  h += '<div class="card"><div class="hd">Hàng đợi gửi đi</div><div class="bd tight list">';
  h += '<div style="padding:10px"><button class="btn sm gh" id="donQueue">Dọn việc đã gửi</button></div>';
  if (!q.length) {
    h += '<div class="muted" style="padding:10px">Không có việc nào trong hàng đợi.</div>';
  } else {
    var n = q.length > 8 ? 8 : q.length;
    for (var k = 0; k < n; k++) {
      var viec = q[k];
      var qNhan, qLop;
      if (viec.state === 'pending') { qNhan = 'chờ gửi'; qLop = 'tag warn'; }
      else if (viec.state === 'done') { qNhan = 'đã gửi'; qLop = 'tag ok'; }
      else { qNhan = 'lỗi, sẽ thử lại'; qLop = 'tag crit'; }
      h += '<div style="padding:10px">';
      h += '<div>' + E(viec.label) + ' <span class="' + qLop + '">' + qNhan + '</span>' + (viec.tries > 1 ? ' <span class="muted">thử ' + viec.tries + ' lần</span>' : '') + '</div>';
      h += '<div class="mono muted" style="font-size:11px;margin-top:2px">' + E(viec.kind) + ' · ' + E(viec.id) + '</div>';
      h += '</div>';
    }
  }
  h += '</div></div>';
  return h;
}

function bindHopThu(t) {
  var gls = document.querySelectorAll('[data-gl]');
  for (var i = 0; i < gls.length; i++) {
    gls[i].addEventListener('click', function () {
      var r = SM.inbox.simulate(this.getAttribute('data-gl'));
      if (!r.ok) { toast(r.lyDo); return; }
      toast('Đã nhận sự kiện mới từ ' + SM.inbox.nguonCua(r.suKien).ten);
      render();
    });
  }
  var evs = document.querySelectorAll('[data-ev]');
  for (var j = 0; j < evs.length; j++) {
    evs[j].addEventListener('click', function () {
      sheetSuKien(t, this.getAttribute('data-ev'));
    });
  }
  var don = document.getElementById('donQueue');
  if (don) {
    don.addEventListener('click', function () {
      SM.clearQueueDone();
      render();
    });
  }
}

function sheetSuKien(t, evId) {
  var ds = SM.inbox.list(t.id);
  var suKien = null;
  for (var i = 0; i < ds.length; i++) {
    if (ds[i].id === evId) { suKien = ds[i]; break; }
  }
  if (!suKien) { toast('Không tìm thấy sự kiện'); return; }
  var ng = SM.inbox.nguonCua(suKien);
  var h = '';
  h += '<table class="t"><tbody>';
  h += '<tr><td>Ai gửi</td><td>' + E(ng.ten) + ' <span class="muted">(' + E(ng.loai) + ')</span></td></tr>';
  h += '<tr><td>Đến bằng đường nào</td><td>' + E(ng.kenh) + '</td></tr>';
  h += '<tr><td>Địa chỉ nhận</td><td class="mono">' + E(ng.endpoint) + '</td></tr>';
  h += '<tr><td>Lúc</td><td>' + F.dmy(suKien.luc) + ' ' + F.hm(suKien.luc) + '</td></tr>';
  h += '</tbody></table>';
  h += '<div class="card" style="margin-top:10px"><div class="hd">Nội dung thô nhận được</div><div class="bd tight"><div style="overflow:auto;max-height:240px"><pre class="mono" style="font-size:11px;background:var(--sunk);padding:10px;margin:0">' + E(JSON.stringify(suKien.payload, null, 2)) + '</pre></div></div></div>';
  if (suKien.trangThai === 'moi') {
    h += '<div id="loiXuLy"></div>';
    h += '<div style="padding:10px"><button class="btn pri w" id="xuLySuKien">Nhận và xử lý sự kiện này</button></div>';
  } else if (suKien.trangThai === 'da-xu-ly') {
    h += '<div class="note ok" style="margin-top:10px">Đã tạo ra: ' + E(suKien.taoRa.moTa) + ' — mã <span class="mono">' + E(suKien.taoRa.id) + '</span></div>';
  } else if (suKien.trangThai === 'loi') {
    h += '<div class="note crit" style="margin-top:10px">' + E(suKien.ghiChu) + '</div>';
    h += '<div class="note" style="margin-top:6px">Hệ thống đã từ chối sự kiện này để bảo vệ dữ liệu của hộ, không nhận dữ liệu thiếu hoặc sai định dạng.</div>';
  }
  sheet('Chi tiết sự kiện', h, function (w) {
    var nut = w.querySelector('#xuLySuKien');
    if (nut) {
      nut.addEventListener('click', function () {
        var r = SM.inbox.process(evId);
        if (!r.ok) {
          var loi = w.querySelector('#loiXuLy');
          loi.innerHTML = '<div class="note crit">' + E(r.lyDo) + '</div><div class="note">Hệ thống từ chối vì dữ liệu chưa hợp lệ — đây là cách nó tự bảo vệ, chứ không nhận bừa mọi thứ đến tay.</div>';
          return;
        }
        closeSheet();
        toast('Đã xử lý — ' + r.taoRa.moTa);
        render();
      });
    }
  });
}

        else { el('#f-err').innerHTML = '<div class="note crit">' + E(r.lyDo) + '</div>'; }
      };
      var bd = el('#f-del');

function viewDatCho(t){
  const hopLe = t.bookings.filter(b=>b.state!=='cancelled' && b.date>=SM.CLOCK.today);
  const tongTien = hopLe.reduce((s,b)=>s+b.total,0);
  const daCoc = hopLe.filter(b=>b.coc).length;
  let h = '<div class="card"><div class="hd"><h2>Lượt đặt chỗ</h2><div class="sub">Đổi lịch, huỷ, ghi cọc</div></div><div class="bd tight">'
    +'<div class="grid2">'
    +'<div class="row"><span class="muted">Lượt sắp tới</span><span class="sp"></span><b class="big">'+hopLe.length+'</b></div>'
    +'<div class="row"><span class="muted">Tổng tiền</span><span class="sp"></span><b class="big num">'+F.num(tongTien)+'</b></div>'
    +'<div class="row"><span class="muted">Đã thu cọc</span><span class="sp"></span><b class="big">'+daCoc+' lượt</b></div>'
    +'</div></div></div>';
  h += '<div class="card"><div class="hd"><h2>Danh sách lượt đặt</h2><div class="sub">Bấm một lượt để xử lý</div></div><div class="bd"><div class="list">';
  const ds = t.bookings.slice().sort((a,b)=> b.createdAt<a.createdAt?-1: b.createdAt>a.createdAt?1:0).slice(0,12);
  if(!ds.length) h += '<div class="muted">Chưa có lượt đặt nào.</div>';
  for(const b of ds){
    const rs = D.resource(t,b.resource);
    const ch = D.CHANNELS[b.channel]||{ten:b.channel,icon:''};
    let tag = b.state==='cancelled' ? '<span class="tag gray">đã huỷ</span>' : '<span class="tag ok">đã giữ chỗ</span>';
    if(b.invoiceId) tag += ' <span class="tag br">có hoá đơn</span>';
    if(b.coc) tag += ' <span class="tag warn">đã cọc</span>';
    h += '<div class="mi" data-dc="'+E(b.id)+'" style="cursor:pointer">'
      +'<div class="ic"></div><div class="tx"><b>'+E(b.guest)+'</b>'
      +'<div class="muted">'+F.dmy(b.date)+(b.slot?' '+b.slot:'')+' · '+E(rs?rs.ten:b.resource)+' · '+b.pax+' khách · '+E(ch.ten)+'</div></div>'
      +'<div class="ar" style="text-align:right"><b class="num">'+F.num(b.total)+'</b><div>'+tag+'</div></div></div>';
  }
  h += '</div></div></div>';
  return h;
}

      h += '<div class="card"><div class="hd"><h2>Ghi cọc</h2></div><div class="bd tight">';
      if(b.coc){
        h += '<div class="note ok">Đã nhận cọc '+F.num(b.coc.soTien)+' ngày '+F.dmy(b.coc.ngay)+'. Không ghi lại lần nữa.</div>';
      }else{
        h += '<div class="fld"><input id="dc-coc" type="number" inputmode="numeric" placeholder="Số tiền cọc"></div>'
          +'<button class="btn pri w" id="dc-btn-coc">Ghi nhận đã cọc</button>';
      }
      h += '</div></div>';
      h += '<div class="card"><div class="hd"><h2>Đổi lịch</h2><div class="sub">7 ngày tới</div></div><div class="bd tight">'
        +'<div class="fld"><select id="dc-ngay">';
      const cal = D.calendar(t, SM.CLOCK.today, 7);
      for(const d of cal) h += '<option value="'+d.date+'"'+(d.date===b.date?' selected':'')+'>'+F.dShort(d.date)+'</option>';
      h += '</select></div><div class="fld"><select id="dc-khung">';
      const slots = rs && rs.slots ? rs.slots : [];
      if(!slots.length) h += '<option value="">cả ngày</option>';
      for(const s of slots) h += '<option value="'+s+'"'+(s===b.slot?' selected':'')+'>'+s+'</option>';
      h += '</select></div><div id="dc-err"></div>'
        +'<button class="btn pri w" id="dc-btn-doi">Đổi lịch</button></div></div>';
      h += '<div class="card"><div class="hd"><h2>Huỷ lượt đặt</h2></div><div class="bd tight">'
        +'<div class="fld"><input id="dc-lydo" placeholder="Lý do huỷ (bắt buộc)"></div>'
        +(b.coc?'<div class="note warn">Lượt này đã nhận cọc '+F.num(b.coc.soTien)+' — phải xử lý hoàn/ giữ tiền cọc theo thoả thuận.</div>':'')
        +'<button class="btn dan w" id="dc-btn-huy">Huỷ lượt đặt</button></div></div>';
      sheet(E(b.id)+' — '+E(b.guest), h, ()=>{
        const q = s=>document.querySelector(s);
        const qc = q('#dc-btn-coc');
        if(qc) qc.addEventListener('click',()=>{
          const soTien = parseInt(q('#dc-coc').value,10);
          if(!soTien || soTien<=0){ toast('Nhập số tiền cọc hợp lệ.'); return; }
          if(soTien > b.total){ toast('Tiền cọc vượt tổng tiền lượt đặt.'); return; }
          b.coc = {soTien, ngay: SM.CLOCK.today};
          SM.save(); toast('Đã ghi cọc '+F.num(soTien)+'.'); closeSheet(); render();
        });
        q('#dc-btn-doi').addEventListener('click',()=>{
          const nDate = q('#dc-ngay').value, nSlot = q('#dc-khung').value || null;
          if(nDate===b.date && nSlot===b.slot){ toast('Vẫn lịch cũ, không cần đổi.'); return; }
          const kq = D.checkBooking(t,{resource:b.resource,date:nDate,slot:nSlot,pax:b.pax});
          const err = q('#dc-err');
          if(!kq.ok){
            err.innerHTML = '<div class="note crit">'+E(kq.lyDo)+'</div>';
            return;
          }
          err.innerHTML = '';
          b.date = nDate; b.slot = nSlot;
          SM.save(); toast('Đã đổi lịch sang '+F.dmy(nDate)+(nSlot?' '+nSlot:'')+'.'); closeSheet(); render();
        });
        q('#dc-btn-huy').addEventListener('click',()=>{
          const lyDo = q('#dc-lydo').value.trim();
          if(!lyDo){ toast('Phải nhập lý do huỷ.'); return; }
          b.state = 'cancelled'; b.ghiChuHuy = lyDo;
          SM.save();
          toast(b.coc ? 'Đã huỷ. Nhớ xử lý tiền cọc đã nhận.' : 'Đã huỷ lượt đặt, chỗ trả lại cho khung giờ.');
          closeSheet(); render();
        });
      });
    });
  });
}

function viewTaiNguyen(t){
  const KIND = {room:'phòng', boat:'thuyền', activity:'hoạt động'};
  let h = '<div class="card"><div class="hd"><h2>Tài nguyên</h2><div class="sub">Phòng, thuyền, hoạt động dịch vụ</div></div>'
    +'<div class="bd"><div class="list">';
  if(!t.resources.length) h += '<div class="muted">Chưa có tài nguyên.</div>';
  for(const r of t.resources){
    let dat7 = 0;
    for(let i=0;i<7;i++){
      const d = SM.dayOffset(SM.CLOCK.today,i);
      if(r.slots && r.slots.length){
        for(const s of r.slots) dat7 += D.used(t,r.id,d,s);
      } else dat7 += D.used(t,r.id,d,null);
    }
    h += '<div class="mi" data-tn="'+E(r.id)+'" style="cursor:pointer"><div class="ic"></div><div class="tx"><b>'+E(r.ten)+'</b>'
      +'<div class="muted">'+KIND[r.kind]+' · chứa '+r.capacity+(r.slots&&r.slots.length?' · '+r.slots.length+' khung':'')+'</div></div>'
      +'<div class="ar"><b class="num">'+dat7+'</b><div class="muted">chỗ đặt 7 ngày</div></div></div>';
  }
  h += '</div><button class="btn pri w" id="tn-them" style="margin-top:10px">Thêm tài nguyên</button></div></div>';

  const combos = t.skus.filter(s=>s.sku.indexOf('COMBO')===0);
  h += '<div class="card"><div class="hd"><h2>Bảng giá gói dịch vụ</h2></div><div class="bd"><div class="list">';
  if(!combos.length) h += '<div class="muted">Chưa có gói nào.</div>';
  for(const s of combos){
    h += '<div class="mi"><div class="ic"></div><div class="tx"><b>'+E(s.name)+'</b>'
      +'<div class="muted">'+E(s.sku)+' · '+E(s.unit||'khách')+'</div></div>'
      +'<div class="ar"><b class="num">'+F.num(s.price)+'</b><br><button class="btn sm gh" data-goi="'+E(s.sku)+'">Sửa giá</button></div></div>';
  }
  h += '</div><button class="btn pri w" id="goi-them" style="margin-top:10px">Thêm gói mới</button></div></div>';
  h += '<div class="note br">Giá gói đổi theo mùa — lịch sử đổi giá được ghi lại ở Danh mục hàng hoá.</div>';
  return h;
}

function bindTaiNguyen(t){
  const KIND = {room:'phòng', boat:'thuyền', activity:'hoạt động'};
  document.querySelectorAll('[data-tn]').forEach(el=>{
    el.addEventListener('click',()=>{
      const r = D.resource(t, el.getAttribute('data-tn'));
      if(!r) return;
      let h = '<div class="note br"><b>'+E(r.ten)+'</b> · '+KIND[r.kind]+'</div>'
        +'<div class="fld"><label>Tên</label><input id="tn-e-ten" value="'+E(r.ten)+'"></div>'
        +'<div class="fld"><label>Sức chứa</label><input id="tn-e-cap" type="number" inputmode="numeric" value="'+r.capacity+'"></div>'
        +'<div id="tn-e-err"></div><button class="btn pri w" id="tn-e-luu">Lưu thay đổi</button>';
      sheet('Sửa tài nguyên', h, ()=>{
        document.querySelector('#tn-e-luu').addEventListener('click',()=>{
          const ten = document.querySelector('#tn-e-ten').value.trim();
          let cap = parseInt(document.querySelector('#tn-e-cap').value,10);
          if(!ten){ toast('Tên không được để trống.'); return; }
          if(!cap || cap<=0){ toast('Sức chứa không hợp lệ.'); return; }
          if(cap < r.capacity){
            for(let i=0;i<7;i++){
              const d = SM.dayOffset(SM.CLOCK.today,i);
              const khungs = r.slots && r.slots.length ? r.slots : [null];
              for(const s of khungs){
                const used = D.used(t,r.id,d,s);
                if(used > cap){
                  document.querySelector('#tn-e-err').innerHTML = '<div class="note crit">Không giảm được: khung '+(s||'cả ngày')+' ngày '+F.dmy(d)+' đã có '+used+' khách, lớn hơn sức chứa mới '+cap+'.</div>';
                  return;
                }
              }
            }
          }
          r.ten = ten; r.capacity = cap;
          SM.save(); toast('Đã lưu tài nguyên.'); closeSheet(); render();
        });
      });
    });
  });
  document.querySelector('#tn-them').addEventListener('click',()=>{
    let h = '<div class="fld"><label>Tên</label><input id="tn-m-ten"></div>'
      +'<div class="fld"><label>Loại</label><select id="tn-m-kind">'
      +'<option value="room">phòng</option><option value="boat">thuyền</option><option value="activity">hoạt động</option></select></div>'
      +'<div class="fld"><label>Sức chứa</label><input id="tn-m-cap" type="number" inputmode="numeric" value="1"></div>'
      +'<div class="fld" id="tn-m-slot-fld" style="display:none"><label>Khung giờ (phân cách bằng dấu phẩy)</label><input id="tn-m-slots" placeholder="07:30, 09:30"></div>'
      +'<button class="btn pri w" id="tn-m-luu">Lưu</button>';
    sheet('Thêm tài nguyên', h, ()=>{
      const sel = document.querySelector('#tn-m-kind');
      const up = ()=>{ document.querySelector('#tn-m-slot-fld').style.display = sel.value==='room'?'none':'block'; };
      sel.addEventListener('change',up);
      document.querySelector('#tn-m-luu').addEventListener('click',()=>{
        const ten = document.querySelector('#tn-m-ten').value.trim();
        const kind = sel.value;
        let cap = parseInt(document.querySelector('#tn-m-cap').value,10);
        if(!ten){ toast('Nhập tên tài nguyên.'); return; }
        if(!cap || cap<=0) cap = 1;
        let slots = null;
        if(kind!=='room'){
          slots = document.querySelector('#tn-m-slots').value.split(',').map(s=>s.trim()).filter(Boolean);
          if(!slots.length){ toast('Nhập ít nhất một khung giờ.'); return; }
        }
        let base = ten.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');
        let id = base, i = 2;
        while(t.resources.some(r=>r.id===id)){ id = base + i; i++; }
        const r = {id, ten, kind, capacity:cap};
        if(slots) r.slots = slots;
        t.resources.push(r);
        SM.save(); toast('Đã thêm '+E(ten)+'.'); closeSheet(); render();
      });
    });
  });
  document.querySelectorAll('[data-goi]').forEach(el=>{
    el.addEventListener('click',()=>{
      const s = t.skus.find(x=>x.sku===el.getAttribute('data-goi'));
      if(!s) return;
      let h = '<div class="note br">'+E(s.name)+' · giá hiện tại '+F.num(s.price)+' / '+E(s.unit||'khách')+'</div>'
        +'<div class="fld"><label>Giá mới</label><input id="goi-gia" type="number" inputmode="numeric" value="'+s.price+'"></div>'
        +'<div id="goi-err"></div><button class="btn pri w" id="goi-luu">Lưu giá</button>';
      sheet('Sửa giá gói', h, ()=>{
        document.querySelector('#goi-luu').addEventListener('click',()=>{
          const gia = parseInt(document.querySelector('#goi-gia').value,10);
          if(!gia || gia<=0){ toast('Giá không hợp lệ.'); return; }
          const kq = D.upsertSku(t,{sku:s.sku,name:s.name,unit:s.unit||'khách',price:gia,taxGroup:s.taxGroup,baoQuan:s.baoQuan});
          if(!kq.ok){ document.querySelector('#goi-err').innerHTML = '<div class="note crit">'+E(kq.lyDo)+'</div>'; return; }
          SM.save(); toast(kq.doiGia?'Đã đổi giá, lịch sử giữ ở Danh mục hàng hoá.':'Đã lưu giá.'); closeSheet(); render();
        });
      });
    });
  });
  document.querySelector('#goi-them').addEventListener('click',()=>{
    let h = '<div class="fld"><label>Mã</label><input id="goi-m-ma" placeholder="VD: COMBO-GIA-DINH"></div>'
      +'<div class="fld"><label>Tên gói</label><input id="goi-m-ten"></div>'
      +'<div class="fld"><label>Giá</label><input id="goi-m-gia" type="number" inputmode="numeric"></div>'
      +'<div id="goi-m-err"></div><button class="btn pri w" id="goi-m-luu">Lưu</button>';
    sheet('Thêm gói mới', h, ()=>{
      document.querySelector('#goi-m-luu').addEventListener('click',()=>{
        let ma = document.querySelector('#goi-m-ma').value.trim().toUpperCase();
        const ten = document.querySelector('#goi-m-ten').value.trim();
        const gia = parseInt(document.querySelector('#goi-m-gia').value,10);
        if(!ma){ toast('Nhập mã gói.'); return; }
        if(ma.indexOf('COMBO')!==0) ma = 'COMBO-'+ma;
        if(!ten){ toast('Nhập tên gói.'); return; }
        if(!gia || gia<=0){ toast('Giá không hợp lệ.'); return; }
        const kq = D.upsertSku(t,{sku:ma,name:ten,unit:'khách',price:gia,taxGroup:null,baoQuan:null});
        if(!kq.ok){ document.querySelector('#goi-m-err').innerHTML = '<div class="note crit">'+E(kq.lyDo)+'</div>'; return; }
        SM.save(); toast('Đã thêm gói '+E(ma)+'.'); closeSheet(); render();
      });
    });
  });
}

function viewTraHang(t){
  if(!Array.isArray(t.returns)) t.returns = [];
  const ngayBD = SM.dayOffset(SM.CLOCK.today,-30);
  const trongKy = t.returns.filter(r=>r.ngay>=ngayBD);
  const tongTien = trongKy.reduce((s,r)=>s+r.soTien,0);
  const daGiao = t.orders.filter(o=>o.state==='done'||o.state==='paid');
  const tongGiao = daGiao.reduce((s,o)=>s+o.total,0);
  let h = '<div class="card"><div class="hd"><h2>Trả hàng và đổi hàng</h2></div><div class="bd tight"><div class="grid2">'
    +'<div class="row"><span class="muted">Lượt trả 30 ngày</span><span class="sp"></span><b class="big">'+trongKy.length+'</b></div>'
    +'<div class="row"><span class="muted">Tiền trả lại</span><span class="sp"></span><b class="big num">'+F.num(tongTien)+'</b></div>'
    +'<div class="row"><span class="muted">Tỷ lệ trả</span><span class="sp"></span><b class="big">'+F.pct(tongGiao?tongTien/tongGiao:0)+'</b></div>'
    +'</div></div></div>';
  h += '<div class="card"><div class="hd"><h2>Ghi lượt trả hàng</h2><div class="sub">Chọn đơn đã giao hoặc đã thu tiền</div></div><div class="bd">'
    +'<div class="fld"><select id="th-don"><option value="">— chọn đơn —</option>';
  for(const o of daGiao){
    h += '<option value="'+E(o.id)+'">'+E(o.id)+' · '+E(o.buyer)+' · '+F.num(o.total)+'</option>';
  }
  h += '</select></div><div id="th-dong"></div>'
    +'<div class="fld"><label>Loại</label><select id="th-loai"><option value="tra">Trả lại tiền</option><option value="doi">Đổi hàng khác</option></select></div>'
    +'<div class="fld"><label>Lý do (bắt buộc)</label><input id="th-lydo"></div>'
    +'<div class="row"><span>Nhập lại kho (hàng còn tốt)</span><span class="sp"></span><input type="checkbox" id="th-nhapkho" checked></div>'
    +'<div id="th-canhbao"></div><div id="th-err"></div>'
    +'<button class="btn pri w" id="th-luu">Ghi lượt trả</button></div></div>';
  h += '<div class="card"><div class="hd"><h2>Đã trả</h2></div><div class="bd"><div class="list">';
  if(!t.returns.length) h += '<div class="muted">Chưa có lượt trả nào.</div>';
  for(const r of t.returns.slice().reverse()){
    h += '<div class="mi"><div class="ic"></div><div class="tx"><b>'+E(r.id)+'</b>'
      +'<div class="muted">'+F.dmy(r.ngay)+' · '+E(r.khach)+' · '+(r.loai==='doi'?'đổi hàng':'trả tiền')+' · '+(r.nhapLaiKho?'đã nhập lại kho'+(r.lotIds&&r.lotIds.length?' ('+r.lotIds.map(E).join(', ')+')':''):'không nhập kho')+'</div>'
      +'<div class="muted">Lý do: '+E(r.lyDo)+'</div></div>'
      +'<div class="ar"><b class="num">'+F.num(r.soTien)+'</b></div></div>';
  }
  h += '</div></div></div>';
  h += '<div class="note crit">Nếu đơn đã xuất hoá đơn thì trả hàng phải xử lý hoá đơn điều chỉnh theo quy định — nền tảng ghi nhận lượt trả nhưng KHÔNG tự sửa hoá đơn đã phát hành.</div>';
  return h;
}

function bindTraHang(t){
  if(!Array.isArray(t.returns)) t.returns = [];
  const selDon = document.querySelector('#th-don');
  const veDong = ()=>{
    const o = t.orders.find(x=>x.id===selDon.value);
    const box = document.querySelector('#th-dong');
    const cb = document.querySelector('#th-canhbao');
    if(!o){ box.innerHTML=''; if(cb) cb.innerHTML=''; return; }
    let h = '<table class="t"><tr><th>Hàng</th><th>Đã bán</th><th>Trả</th></tr>';
    for(const l of o.lines){
      const s = t.skus.find(x=>x.sku===l.sku);
      h += '<tr><td>'+E(s?s.name:l.sku)+'</td><td class="num">'+l.qty+'</td>'
        +'<td><input type="number" inputmode="numeric" min="0" max="'+l.qty+'" value="0" data-th-sku="'+E(l.sku)+'" data-th-max="'+l.qty+'" style="width:64px"></td></tr>';
    }
    h += '</table>';
    box.innerHTML = h;
    if(cb) cb.innerHTML = o.invoiceId ? '<div class="note crit">Đơn '+E(o.id)+' đã có hoá đơn '+E(o.invoiceId)+' — trả hàng cần hoá đơn điều chỉnh theo quy định.</div>' : '';
  };
  selDon.addEventListener('change',veDong);
  document.querySelector('#th-nhapkho').addEventListener('change',()=>{
    const tich = document.querySelector('#th-nhapkho').checked;
    document.querySelector('#th-canhbao').insertAdjacentHTML('afterend','');
    const cu = document.querySelector('#th-warn-hong');
    if(cu) cu.remove();
    if(!tich) document.querySelector('#th-canhbao').insertAdjacentHTML('afterend','<div class="note warn" id="th-warn-hong">Hàng hỏng không nhập lại kho — phần này là tổn thất, nên ghi vào Khoản chi.</div>');
  });
  document.querySelector('#th-luu').addEventListener('click',()=>{
    const o = t.orders.find(x=>x.id===selDon.value);
    if(!o){ toast('Chọn đơn cần trả hàng.'); return; }
    const lyDo = document.querySelector('#th-lydo').value.trim();
    if(!lyDo){ toast('Phải nhập lý do trả.'); return; }
    const dong = [];
    document.querySelectorAll('[data-th-sku]').forEach(ip=>{
      const qty = parseInt(ip.value,10)||0;
      const max = parseInt(ip.getAttribute('data-th-max'),10);
      if(qty<0){ toast('Số lượng trả không được âm.'); return; }
      if(qty>max){ toast('Số trả vượt số đã bán ở một dòng.'); return; }
      if(qty>0){
        const line = o.lines.find(l=>l.sku===ip.getAttribute('data-th-sku'));
        dong.push({sku:line.sku, qty, amount: Math.round(line.amount/line.qty*qty)});
      }
    });
    if(document.querySelector('#th-err') && dong.length===0 && !document.querySelectorAll('[data-th-sku]').some(ip=>(parseInt(ip.value,10)||0)>0)){
      document.querySelector('#th-err').innerHTML = '<div class="note crit">Chưa nhập số lượng trả ở dòng nào.</div>';
      return;
    }
    if(!dong.length) return;
    const nhapLaiKho = document.querySelector('#th-nhapkho').checked;
    const lotIds = [];
    if(nhapLaiKho){
      for(const d of dong){
        const kq = D.nhapKho(t,{sku:d.sku, qty:d.qty, nguon:'tra-lai', ghiChu:'Trả từ đơn '+o.id+' — '+lyDo});
        if(!kq.ok){ toast('Không nhập kho được '+d.sku+': '+kq.lyDo); return; }
        if(kq.lot) lotIds.push(kq.lot);
      }
    }
    const soTien = dong.reduce((s,d)=>s+d.amount,0);
    const thangNgay = SM.CLOCK.today.slice(5,7)+SM.CLOCK.today.slice(8,10);
    let stt = t.returns.filter(r=>r.id.indexOf('TH-'+thangNgay+'-')===0).length + 1;
    let id;
    do{ id = 'TH-'+thangNgay+'-'+(stt<10?'0':'')+stt; stt++; } while(t.returns.some(r=>r.id===id));
    t.returns.push({id, ngay:SM.CLOCK.today, orderId:o.id, khach:o.buyer, lyDo, loai:document.querySelector('#th-loai').value, dong, soTien, nhapLaiKho, lotIds});
    SM.save();
    toast('Đã ghi lượt trả '+id+(nhapLaiKho?' và nhập lại kho.':' — hàng hỏng, nên ghi Khoản chi.'));
    render();
  });
}

/* ═══ ĐỢT 4: kết ca · công nợ · hoá đơn điều chỉnh · nhật ký · giá đổi · huỷ hàng hỏng
   GLM dựng (tự soi 3 vai), Claude ra đề và verify ═══ */
/* TỰ SỬA SAU KHI SOI: 1) Thêm kiểm tra input số hợp lệ & không cho kết ca khi ô đếm rỗng để tránh bấm nhầm mất tiền; chữ .big.num to rõ cho bà Bảy. 2) Mọi nút đều đọc dữ liệu thật từ O.*, lỗi hiện tại chỗ (sheet/note.crit) hoặc toast, không hard-code kết quả. 3) Có dấu vết: lý do lệch, lịch sử trả, lyDoDC đều lưu qua API; mọi chuỗi dữ liệu bọc E(). */

function viewKetCa(t) {
  let h = '';
  const ca = O.caHienTai(t);

      + '<button class="btn pri w" id="kc-ket" style="font-size:1.2rem;padding:0.7rem">KẾT CA</button></div></div>';
  }

    h += '<div class="card"><div class="hd"><h2>Các ca đã kết</h2></div><div class="bd tight"><div class="list">';

}

function bindKetCa(t) {
  const mo = document.querySelector('#kc-mo-ca');
  if (mo) mo.onclick = () => {
    const v = parseInt(document.querySelector('#kc-tien-dau').value, 10);
    if (isNaN(v) || v < 0) { toast('Nhập tiền đầu ca hợp lệ'); return; }
    const r = O.moCa(t, v);
    if (!r.ok) toast(r.lyDo); else { toast('Đã mở ca'); render(); }
  };
  const inp = document.querySelector('#kc-dem');
  const cap = () => {
    const box = document.querySelector('#kc-lech-box');
    const ly = document.querySelector('#kc-lydo-box');
    if (!inp || !box) return;
    const v = inp.value.trim();
    if (v === '') { box.innerHTML = ''; ly.style.display = 'none'; return; }
    const duKien = O.tinhCa(t, O.caHienTai(t)).duKienTrongKet;
    const dem = parseInt(v, 10);
    if (isNaN(dem)) { box.innerHTML = ''; return; }
    const lech = dem - duKien;
    let tag = '<span class="tag ok">khớp tiền</span>';
    if (lech < 0) tag = '<span class="tag crit">THIẾU ' + F.num(Math.abs(lech)) + ' đ</span>';
    else if (lech > 0) tag = '<span class="tag warn">THỪA ' + F.num(lech) + ' đ</span>';
    box.innerHTML = '<div class="row" style="margin-top:0.5rem"><div>Chênh lệch</div><div class="sp"></div><div>' + tag + '</div></div>';
    ly.style.display = lech !== 0 ? '' : 'none';
  };
  if (inp) { inp.oninput = cap; cap(); }
  const ket = document.querySelector('#kc-ket');
  if (ket) ket.onclick = () => {
    const v = parseInt(document.querySelector('#kc-dem').value, 10);
    if (isNaN(v) || v < 0) { toast('Đếm tiền rồi nhập số thực tế trước khi kết ca'); return; }
    const ly = document.querySelector('#kc-lydo').value.trim();
    const r = O.ketCa(t, v, ly);
    if (!r.ok) { toast(r.lyDo); return; }
    toast(r.lech === 0 ? 'Kết ca khớp tiền' : 'Kết ca xong, lệch ' + F.num(r.lech) + ' đ');
    render();
  };
}

function viewNhatKy(t){
  const ds = O.nhatKy(t);
  const homNay = SM.CLOCK.today;
  const soHomNay = ds.filter(x=>x.ngay===homNay).length;
  const coLyDo = ds.filter(x=>x.lyDo).length;
  const viecKhacNhau = [];
  ds.forEach(x=>{ if(viecKhacNhau.indexOf(x.viec)<0) viecKhacNhau.push(x.viec); });
  let html = '<div class="card"><div class="hd"><h2>Nhật ký thao tác</h2><div class="sub">Ai đã làm gì, lúc nào</div></div><div class="bd tight">'
    + '<div class="grid2"><div class="row"><span class="muted">Tổng số việc đã ghi</span><span class="sp"></span><span class="big mono">'+ds.length+'</span></div>'
    + '<div class="row"><span class="muted">Việc hôm nay</span><span class="sp"></span><span class="big mono">'+soHomNay+'</span></div>'
    + '<div class="row"><span class="muted">Việc có ghi lý do</span><span class="sp"></span><span class="big mono">'+coLyDo+'</span></div></div>';
  if(ds.length){
    html += '<div class="fld"><select class="fltViec"><option value="">Tất cả loại việc</option>'
      + viecKhacNhau.map(v=>'<option value="'+E(v)+'">'+E(v)+'</option>').join('')
      + '</select></div><div class="list nkDanhSach">';
    ds.forEach(x=>{
      html += '<div class="mi" data-viec="'+E(x.viec)+'"><div class="tx"><b>'+E(x.viec)+'</b>'
        + ' <span class="muted">'+E(x.ai)+' · '+E(F.dmy(x.ngay))+'</span>'
        + (x.doiTuong?' <span class="mono">'+E(x.doiTuong)+'</span>':'');
      if(x.truoc!==null && x.sau!==null){
        html += '<div><span class="mono">'+F.d(x.truoc)+' → '+F.d(x.sau)+'</span></div>';
      }
      if(x.lyDo){ html += '<div class="muted">'+E(x.lyDo)+'</div>'; }
      html += '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="muted">Chưa có việc gì được ghi. Hãy làm vài thao tác như thu nợ, đổi giá rồi quay lại đây.</div>';
  }
  html += '<div class="note br">Nhật ký không xoá được. Mọi thay đổi số liệu đều để lại dấu vết, kể cả khi kế toán làm thay hộ.</div>';
  html += '</div></div>';
  return html;
}

function bindHuyHong(t){
  const selHang = document.querySelector('.hhChonHang');
  const loWrap = document.querySelector('.hhLoWrap');
  const inpSo = document.querySelector('.hhSoLuong');
  const inpLyDo = document.querySelector('.hhLyDo');
  let loDangChon = null;
  function veLo(){
    loDangChon = null;
    if(!loWrap) return;
    const sku = selHang.value;
    if(!sku){ loWrap.innerHTML=''; return; }
    const ton = D.stockAll(t).filter(function(s){ return s.sku===sku; })[0];
    if(!ton || !ton.lots || !ton.lots.length){ loWrap.innerHTML='<div class="muted">Mặt hàng này không còn lô nào.</div>'; return; }
    let h = '<div class="fld"><label>Chọn lô</label><select class="hhChonLo"><option value="">-- Chọn lô --</option>';
    ton.lots.forEach(function(l){
      h += '<option value="'+E(l.id)+'">'+E(l.id)+' · còn '+F.num(l.qty)+' · vào '+E(F.dmy(l.inDate))+(l.hanDung?' · hạn '+E(F.dmy(l.hanDung)):'')+'</option>';
    });
    h += '</select></div>';
    loWrap.innerHTML = h;
    const selLo = document.querySelector('.hhChonLo');
    selLo.addEventListener('change', function(){ loDangChon = this.value || null; });
  }
  if(selHang) selHang.addEventListener('change', veLo);
  const nut = document.querySelector('.hhGhi');
  if(nut) nut.addEventListener('click', function(){
    if(!selHang.value){ toast('Hãy chọn mặt hàng.'); return; }
    if(!loDangChon){ toast('Hãy chọn lô cần huỷ.'); return; }
    const so = Number(inpSo.value);
    if(!so || so<=0){ toast('Số lượng huỷ phải lớn hơn 0.'); return; }
    const lyDo = (inpLyDo.value||'').trim();
    if(!lyDo){ toast('Bắt buộc phải ghi lý do huỷ.'); inpLyDo.classList.add('bad'); return; }
    inpLyDo.classList.remove('bad');
    const kq = O.huyLo(t, loDangChon, so, lyDo);
    if(!kq.ok){ toast('Không huỷ được: '+kq.lyDo); return; }
    toast('Đã ghi huỷ '+F.num(so)+' lô '+loDangChon+'. Ước thiệt hại: '+F.d(kq.uocThietHai)+'. Còn lại: '+F.num(kq.conLai)+'.');
    sheet('Ghi vào Khoản chi?',
      '<div class="bd"><p>Ghi luôn khoản này vào Khoản chi để giá vốn đúng?</p>'
      + '<p class="muted">Mô tả: '+E(kq.goiY)+' · Số tiền: <b class="mono">'+F.d(kq.uocThietHai)+'</b></p>'
      + '<div class="row"><button class="btn pri hhGhiChi">Ghi vào Khoản chi</button>'
      + '<button class="btn gh" onclick="closeSheet()">Để sau</button></div></div>',
      function(){
        const b = document.querySelector('.hhGhiChi');
        if(!b) return;
        b.addEventListener('click', function(){
          const r = D.addChi(t, {loai:'nguyen-lieu', moTa:kq.goiY, soTien:kq.uocThietHai, chungTu:'khong'});
          if(r.ok){ closeSheet(); toast('Đã ghi khoản chi '+F.d(kq.uocThietHai)+'.'); render(); }
          else { toast('Không ghi được khoản chi: '+r.lyDo); }
        });
      });
    render();
  });
}

/* TỰ SỬA SAU KHI SOI: 1) Chủ hộ vội: tấm soạn nhắc chỉ 1 textarea + 1 nút gửi, chữ lớn, bấm lỗi chỉ toast không mất nội dung đã sửa; nút "Nhắc khoản này" từ hội thoại đóng tấm cũ rồi mở tấm soạn — đúng 2 chạm. 2) Cán bộ chấm demo: soanNhacNo trả null thì toast thật, guiNhacNo lỗi hiện lyDo thật, không nhánh giả; tin đi/tin đến phân biệt bằng huong/veKhoanNo đúng như dữ liệu. 3) Kế toán: con số lấy từ soanNhacNo (đã trừ daTra theo API), không tự tính lại để tránh lệch sổ; khoản quá hạn lâu nhất xác định bằng so sánh due với SM.CLOCK.today, không bịa ngày. */

function sheetNhacNo(t, khoanId) {
  var so = O.soanNhacNo(t, khoanId);
  if (!so) { toast('Không soạn được lời nhắc cho khoản này'); return; }
  /* D-#4: lộ phí TRƯỚC nút gửi — cửa sổ tin miễn phí còn hay hết [Q-005]; SM.onb chưa nạp thì giữ nguyên hành vi cũ */
  var cuaSo = (SM.onb && SM.onb.cuaSoTin) ? SM.onb.cuaSoTin(t, so.khach) : null;
  var phiTin = '';
  if (cuaSo) {
    if (cuaSo.duongGui === 'giao-dich-165d')
      phiTin = '<div class="note warn" style="margin-top:8px">Khách im lặng ' + (cuaSo.imLangNgay || 0) +
        ' ngày — hết cửa sổ miễn phí, gửi kiểu Giao dịch ' + (cuaSo.phi || 165) + 'đ/tin [Q-005]</div>';
    else if (cuaSo.trong7Ngay)
      phiTin = '<div class="note br" style="margin-top:8px">Tin nhắn miễn phí (còn ' + (cuaSo.freeConLai || 0) + '/8 trong 48 giờ)</div>';
    else
      phiTin = '<div class="note warn" style="margin-top:8px">Khách im lặng ' + (cuaSo.imLangNgay || 0) +
        ' ngày — gửi tin Tư vấn ' + (cuaSo.phi || 55) + 'đ/tin [Q-005]</div>';
  }
  var h = '<div class="muted">' + E(so.giongDieu) +
    (so.lanDaNhac > 0 ? ' · đã nhắc ' + so.lanDaNhac + ' lần' + (so.lanNhacCuoi ? ', lần cuối ' + F.dmy(so.lanNhacCuoi) : '') : '') + '</div>' +
    '<table class="t" style="margin-top:6px"><tr><td>Khách</td><td>' + E(so.khach) + '</td></tr>' +
    '<tr><td>Khoản</td><td class="mono">' + E(so.khoan) + '</td></tr>' +
    '<tr><td>Đã trả</td><td class="num mono">' + F.num(so.daTra) + '</td></tr>' +

    (so.qua > 0 ? '<tr><td>Quá hạn</td><td><span class="tag crit">' + so.qua + ' ngày</span></td></tr>' : '') +
    '</table>' +
    '<div class="fld" style="margin-top:0.6rem"><label>Lời nhắn (chỉnh sửa nếu cần)</label><textarea id="nn-noi" rows="5">' + E(so.than) + '</textarea></div>' +
    '<div class="muted">Trợ lý lấy từ: ' + E(so.tinhTu) + '</div>' +
    phiTin +
    '<button class="btn pri w" id="nn-send">Gửi qua Zalo</button>' +
    '<div class="note br" style="margin-top:8px">Số tiền trong lời nhắc đã trừ phần khách đã trả. Hộ đọc lại rồi mới bấm gửi.</div>';
  sheet('Nhắc nợ: ' + so.khach, h, function () {
    document.querySelector('#nn-send').onclick = function () {
      var noi = document.querySelector('#nn-noi').value;
      var r = O.guiNhacNo(t, khoanId, noi);

      closeSheet(); toast('Đã gửi nhắc nợ, lần thứ ' + r.lanThu); render();
    };
  });
}

    if (r.lichSuTra && r.lichSuTra.length) {
      h += '<div class="list">';
      r.lichSuTra.forEach(l => { h += '<div class="row"><div>' + E(l.ngay ? F.dmy(l.ngay) : '') + ' · ' + E(l.hinhThuc || '') + '</div><div class="sp"></div><div class="num mono">' + F.num(l.soTien) + '</div></div>'; });
      h += '</div>';
    } else h += '<div class="muted">Chưa trả lần nào.</div>';
    h += '<button class="btn w" id="cn-nhacno" style="margin-top:0.6rem">Nhắc nợ qua tin nhắn</button>';
    h += '<div id="cn-err"></div>'
      + '<div class="fld" style="margin-top:0.6rem"><label>Số tiền trả lần này (đồng)</label><input id="cn-tra-sotien" type="number" inputmode="numeric" value="' + r.conLai + '"></div>'
      + '<div class="fld"><label>Hình thức</label><select id="cn-hinhthuc"><option>Tiền mặt</option><option>Chuyển khoản</option></select></div>'
      + '<button class="btn pri w" id="cn-tra">Ghi nhận đã trả</button>'
      + '<div class="fld" style="margin-top:0.8rem"><label>Lý do ghi nợ khó đòi (bắt buộc nếu ghi khó đòi)</label><input id="cn-lydo-kd" placeholder="VD: khách bỏ trốn, tranh chấp"></div>'
      + '<button class="btn dan w" id="cn-khodoi">Ghi nợ khó đòi</button>';
    sheet('Nợ: ' + r.buyer, h, () => {
      document.querySelector('#cn-nhacno').onclick = () => { sheetNhacNo(t, r.id); };
      document.querySelector('#cn-tra').onclick = () => {
        const v = parseInt(document.querySelector('#cn-tra-sotien').value, 10);
        if (isNaN(v) || v <= 0) { document.querySelector('#cn-err').innerHTML = '<div class="note crit">Nhập số tiền hợp lệ.</div>'; return; }
        const res = O.traNoMotPhan(t, r.id, v, document.querySelector('#cn-hinhthuc').value);
        if (!res.ok) { document.querySelector('#cn-err').innerHTML = '<div class="note crit">' + E(res.lyDo) + '</div>'; return; }
        closeSheet(); toast(res.traHet ? 'Đã trả hết nợ' : 'Đã ghi nhận, còn nợ ' + F.num(res.conNo)); render();
      };
      document.querySelector('#cn-khodoi').onclick = () => {
        const ly = document.querySelector('#cn-lydo-kd').value.trim();
        if (!ly) { document.querySelector('#cn-err').innerHTML = '<div class="note crit">Phải ghi lý do trước khi ghi khó đòi.</div>'; return; }
        const res = O.xoaNoKhoDoi(t, r.id, ly);
        if (!res.ok) { document.querySelector('#cn-err').innerHTML = '<div class="note crit">' + E(res.lyDo) + '</div>'; return; }
        closeSheet(); toast('Đã ghi nhận nợ khó đòi'); render();
      };
    });
  });
  const xem = document.querySelector('#cn-xem');
  if (xem) xem.onclick = () => {
    const kh = sel.value, st = parseInt(document.querySelector('#cn-sotien').value, 10);
    const kq = document.querySelector('#cn-kq');
    if (!kh || isNaN(st) || st <= 0) { kq.innerHTML = '<div class="note crit">Chọn khách và nhập số tiền hợp lệ.</div>'; return; }
    const d = O.doiSoatB2B(t, kh, st);
    let h = '<table class="t"><tr><td>Tổng nợ</td><td class="num mono">' + F.num(d.tongNo) + '</td></tr>'
      + '<tr><td>Số tiền nhận</td><td class="num mono">' + F.num(d.soTienNhan) + '</td></tr>'
      + '<tr><td>Lệch</td><td class="num mono">' + F.num(d.lech) + '</td></tr></table>';
    h += '<table class="t"><tr><th>Ghi chú</th><th>Nợ</th><th>Trả</th><th>Còn lại</th></tr>';
    d.phanBo.forEach(p => { h += '<tr><td>' + E(p.note || '') + '</td><td class="num mono">' + F.num(p.no) + '</td><td class="num mono">' + F.num(p.tra) + '</td><td class="num mono">' + F.num(p.conLai) + '</td></tr>'; });
    h += '</table><div class="note">' + E(d.ketLuan) + '</div>';
    if (d.lech !== 0) h += '<div class="fld"><label>Lý do lệch</label><input id="cn-lydo-lech" placeholder="Ghi rõ lý do chênh lệch"></div>';
    h += '<button class="btn pri w" id="cn-chot">Chốt đối soát</button>';
    kq.innerHTML = h;
    document.querySelector('#cn-chot').onclick = () => {
      const ly = d.lech !== 0 ? (document.querySelector('#cn-lydo-lech') || { value: '' }).value.trim() : '';
      if (d.lech !== 0 && !ly) { toast('Phải ghi lý do lệch trước khi chốt'); return; }
      const res = O.chotDoiSoat(t, kh, st, ly);
      if (!res.ok) { toast(res.lyDo); return; }
      toast('Đã chốt đối soát'); render();
    };
  };
}

function viewHoiThoai(t) {
  var ms = D.messages(t);
  var chua = ms.filter(function (m) { return !m.daTraLoi; }).length;
  var daGui = ms.filter(function (m) { return m.huong === 'di'; }).length;
  var h = '';
  h += '<div class="grid2">';
  h += '<div class="card"><div class="hd"><h2>Tin chưa trả lời</h2></div><div class="bd"><div class="big num">' + F.num(chua) + '</div></div></div>';
  h += '<div class="card"><div class="hd"><h2>Tin mình đã gửi</h2></div><div class="bd"><div class="big num">' + F.num(daGui) + '</div></div></div>';
  h += '</div>';
  h += '<div class="card"><div class="hd"><h2>Tin nhắn</h2></div><div class="bd"><div class="list">';
  var homNay = SM.CLOCK.today;
  ms.forEach(function (m) {
    var kn = D.CHANNELS[m.kenh];
    var di = m.huong === 'di';
    var nd = m.noiDung.length > 80 ? m.noiDung.slice(0, 80) + '…' : m.noiDung;
    h += '<div class="mi" data-tn="' + E(m.id) + '"><div class="ic">' + (di ? '📤' : (kn ? kn.icon : '💬')) + '</div><div class="tx"><b>' + E(m.tu) +
      ' ' + (di ? '<span class="tag br">mình gửi</span>' : (m.daTraLoi ? '<span class="tag ok">đã trả lời</span>' : '<span class="tag crit">chưa trả lời</span>')) +
      (m.veKhoanNo ? ' <span class="tag warn">nhắc nợ</span>' : '') + '</b>' +
      '<span class="muted">' + F.dmy(m.date) + ' · ' + E(kn ? kn.ten : m.kenh) + '</span><span>' + E(nd) + '</span>';
    var nc = O.noCuaNguoi(t, m.tu);
    if (nc) {
      h += '<span class="muted">Đang nợ ' + F.num(nc.tongCon) + ' · ' + nc.quaHan + ' khoản quá hạn</span>';
    }
    h += '</div></div>';
  });
  h += '</div></div></div>';
  return h;
}

function bindHoiThoai(t) {
  document.querySelectorAll('[data-tn]').forEach(function (n) {
    n.onclick = function () {
      var id = n.getAttribute('data-tn');
      var m = D.messages(t).find(function (x) { return x.id === id; });
      if (!m) return;
      var kn = D.CHANNELS[m.kenh];
      var h = '<div class="bd"><div class="note br">' + E(m.noiDung) + '</div>' +
        '<div class="muted" style="padding:4px 0">' + E(m.tu) + ' · ' + E(kn ? kn.ten : m.kenh) + ' · ' + F.dmy(m.date) + '</div>';
      if (m.daTraLoi) {
        h += '<div class="note ok">' + E(m.traLoi || '') + '<div class="muted">Đã gửi: ' + F.dmy(m.traLoiLuc) + '</div></div>';
      } else {
        var gy = D.goiYTraLoi(t, m);
        h += '<div class="fld"><label>Trả lời (chỉnh sửa nếu cần)</label><textarea id="tl-noi" rows="5">' + E(gy.than) + '</textarea></div>' +
          '<div class="muted">Trợ lý lấy từ: ' + E(gy.tinhTu) + '</div>' +
          '<button class="btn pri w" id="tl-send">Gửi trả lời</button>' +
          '<div class="note br" style="margin-top:8px">Trợ lý chỉ soạn sẵn, người bấm gửi vẫn là hộ.</div>';
      }
      var nc = O.noCuaNguoi(t, m.tu);
      if (nc) {
        h += '<div class="note warn" style="margin-top:8px">' + E(m.tu) + ' đang nợ <b>' + F.num(nc.tongCon) + '</b> · ' + nc.quaHan + ' khoản quá hạn</div>';
        h += '<table class="t"><tr><th>Mã</th><th>Còn nợ</th><th>Hạn</th></tr>';
        var homNay = SM.CLOCK.today;
        var quaDaiNhat = null;
        nc.khoan.forEach(function (k) {
          var qh = k.due < homNay;
          h += '<tr><td class="mono">' + E(k.id) + '</td><td class="num mono">' + F.num(k.con) + '</td><td>' + F.dmy(k.due) +
            (qh ? ' <span class="tag crit">quá hạn</span>' : '') + '</td></tr>';
          if (qh && (!quaDaiNhat || k.due < quaDaiNhat.due)) quaDaiNhat = k;
        });
        h += '</table>';
        if (quaDaiNhat) {
          h += '<button class="btn w" id="tn-nhacno" style="margin-top:6px">Nhắc khoản này (' + E(quaDaiNhat.id) + ')</button>';
        }
      }
      h += '</div>';
      sheet('Tin nhắn từ ' + m.tu, h, function () {
        var b = document.querySelector('#tl-send');
        if (b) b.onclick = function () {
          var r = D.replyMessage(t, id, document.querySelector('#tl-noi').value);
          if (r.ok) { closeSheet(); toast('Đã gửi trả lời'); render(); }
          else toast(r.lyDo);
        };
        var nb = document.querySelector('#tn-nhacno');
        if (nb) nb.onclick = function () {
          closeSheet();
          sheetNhacNo(t, quaDaiNhatId(m.tu));
        };
        function quaDaiNhatId(ten) {
          var c = O.noCuaNguoi(t, ten);
          if (!c) return null;
          var best = null;
          c.khoan.forEach(function (k) {
            if (k.due < SM.CLOCK.today && (!best || k.due < best.due)) best = k;
          });
          return best ? best.id : null;
        }
      });
    };
  });
}

/* ════════════════════════ RENDER ════════════════════════ */
const VIEWS={ban:[viewBan,bindBan],don:[viewDon,bindDon],lich:[viewLich,bindLich],
  kho:[viewKho,bindKho],mua:[viewMua,bindMua],tien:[viewTien,bindTien],ai:[viewAi,bindAi],
  them:[viewThem,bindThem],ketnoi:[ON.viewTram,ON.bindTram],chiphi:[viewChiphi,null],
  hoso:[viewHoso,bindHoso],dulieu:[viewDulieu,bindDulieu],
  hopthu:[viewHopThu,bindHopThu],
  hanghoa:[viewHangHoa,bindHangHoa], nhapkho:[viewNhapKho,bindNhapKho],
  khoanchi:[viewKhoanChi,bindKhoanChi], khachhang:[viewKhachHang,bindKhachHang],
  hoithoai:[viewHoiThoai,bindHoiThoai],
  datcho:[viewDatCho,bindDatCho], tainguyen:[viewTaiNguyen,bindTaiNguyen],
  trahang:[viewTraHang,bindTraHang],
  ketca:[viewKetCa,bindKetCa], congno:[viewCongNo,bindCongNo], hoadondc:[viewHoaDonDC,bindHoaDonDC],
  nhatky:[viewNhatKy,bindNhatKy], giadoi:[viewGiaDoi,bindGiaDoi], huyhong:[viewHuyHong,bindHuyHong],
  phanquyen:[viewPhanQuyen,bindPhanQuyen], thietbi:[viewThietBi,bindThietBi],
  obkichhoat:[ON.viewObKichHoat,ON.bindObKichHoat], obnhandien:[ON.viewObNhanDien,ON.bindObNhanDien],
  obdanhmuc:[ON.viewObDanhMuc,ON.bindObDanhMuc], obcon:[ON.viewObCon,ON.bindObCon],
  tamdung:[ON.viewTamDung,ON.bindTamDung],
  truyxuat:[viewTruyXuatQR,bindTruyXuatQR]};

function bindNhac(){
  document.querySelectorAll('[data-di]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const di=b.dataset.di;
    /* màn obcon cần biết connector nào: data-di="obcon:<ma>" — mã lưu trong smv3:ui (khoá obConMa), ON.bindObCon đọc lại */
    if(di&&di.indexOf('obcon:')===0){TAB='obcon';SM.setUi({obConMa:di.slice(6)});}
    else TAB=di;
    render();});
}
function render(){
  const t=SM.current();
  if(!VIEWS[TAB]||!VIEWS[TAB][0]) TAB='ban';
  renderHead();renderNav();
  const [v,b]=VIEWS[TAB];
  $('#view').innerHTML=v(t);
  if(b)b(t);
  bindNhac();
  window.scrollTo(0,0);
}

$('#btnWho').onclick=()=>{
  sheet('Chọn chân dung hộ',
    SM.tenantIds().map(id=>{const t=SM.tenant(id),g=D.gatesOf(t),p=D.needsPosInvoice(t);
      return `<button class="card" data-t="${E(id)}" style="width:100%;text-align:left;border:1px solid ${id===SM.current().id?'var(--brand)':'var(--line)'};margin-bottom:10px;display:block">
        <div class="bd"><div class="row"><b style="flex:1;font-size:15px">${E(t.name)}</b><span class="tag br">${E(t.ma)}</span></div>
        <div class="muted">${E(t.diaBan)} · ${E(t.khongGian)} · ${E(t.nganh)}</div>
        <div class="muted" style="margin-top:6px">${t.keCan?`${E(t.keCan.ten)} (${t.keCan.tuoi} tuổi) — ${E(t.keCan.vaiTro)}`:'Chưa nhận diện — hộ mới, chưa làm phần mở đầu'}</div>
        <div class="row wrap" style="gap:5px;margin-top:8px">${g.gates.map(x=>`<span class="tag ${x.dat?'ok':'gray'}">${x.dat?'✓':'○'} ${E(x.ten.split(' ').slice(0,3).join(' '))}</span>`).join('')}</div>
        <div class="muted" style="margin-top:6px">${p.thuocDien?'Thuộc diện hoá đơn từ máy tính tiền':p.sapVuot?'Đang trên đà vượt ngưỡng 1 tỷ':'Dưới ngưỡng 1 tỷ'}</div></div></button>`;}).join('')+
    `<div class="note br">Ba chân dung dùng <b>cùng một bộ khung</b>, khác nhau ở cấu hình — thanh tab đổi theo ngành.</div>`,
   w=>{w.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{SM.switchTenant(b.dataset.t);closeSheet();});});
};
$('#btnMode').onclick=()=>{const m=SM.mode()==='simple'?'full':'simple';SM.setMode(m);
  toast(m==='simple'?'Chế độ đơn giản — chữ lớn, chỉ Bán, Tiền và Trợ lý.':'Chế độ đầy đủ.');};
$('#btnAir').onclick=()=>{const on=!SM.isOnline();SM.setOnline(on);
  toast(on?'Đã có mạng — hàng đợi đang tự gửi lên':'Đã bật chế độ máy bay. Cứ bán tiếp — hoá đơn xếp hàng đợi.');render();};
$('#fab').onclick=()=>{TAB='ai';render();};

SM.on('queue:change',()=>{renderHead();if(TAB==='ban'||TAB==='don')render();});
SM.on('net:change',renderHead);
SM.on('inbox:change',()=>render());
SM.on('db:external',render);
SM.on('ui:change',()=>{cart=[];chat=[];
  /* chế độ đơn giản chỉ có 3 màn — ép TAB về trong tập đó, đừng để hiện màn không có lối quay ra */
  if(SM.mode()==='simple'&&['ban','tien','ai'].indexOf(TAB)<0)TAB='ban';
  render();});

SM.db();render();
/* W6 (B.5): tenant chưa kích hoạt (CD2) → mở màn chào wizard đúng 1 lần; bấm «Để sau» vẫn vào app bình thường — cờ obDaChao nằm trong smv3:ui */
if(SM.onb&&!SM.ui().obDaChao&&SM.onb.trangThai(SM.current()).buoc==='chua_kich_hoat'){
  SM.setUi({obDaChao:1});TAB='obkichhoat';render();
}
setTimeout(()=>{if(window.matchMedia('(max-width:900px)').matches&&!sessionStorage.getItem('smv3:hint')){
  sessionStorage.setItem('smv3:hint','1');
  toast('Bấm Chia sẻ → Thêm vào Màn hình chính để dùng như một ứng dụng',5200);}},1800);
})();
</script>
